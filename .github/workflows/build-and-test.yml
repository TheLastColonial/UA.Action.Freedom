name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release
  PACKABLE_PROJECTS: >-
    src/UA.Action.Freedom.Domain/UA.Action.Freedom.Domain.csproj
    src/UA.Action.Freedom.Application/UA.Action.Freedom.Application.csproj
    src/UA.Action.Freedom.Data/UA.Action.Freedom.Data.csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    outputs:
      packageVersion: ${{ steps.version.outputs.value }}
      isRelease: ${{ steps.version.outputs.isRelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          configFilePath: GitVersion.yml

      - name: Resolve package version
        id: version
        run: |
          base='${{ steps.gitversion.outputs.majorMinorPatch }}'
          if [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            echo "value=${base}" >> "$GITHUB_OUTPUT"
            echo "isRelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=${base}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "isRelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore UA.Action.Freedom.slnx

      - name: Build
        run: >
          dotnet build UA.Action.Freedom.slnx
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: >
          dotnet test
          --solution UA.Action.Freedom.slnx
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --verbosity normal

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          include-hidden-files: true
          retention-days: 1
          path: |
            **/bin/**
            **/obj/**

  # End-to-end lane. The Integration and BDD projects skip themselves when their
  # target is not up (so build-and-test stays green without infrastructure); this
  # job stands up the local Azure simulation from iac/ — exactly the sequence in
  # iac/README.md — and runs them for real against it.
  acceptance:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Configure the local environment
        working-directory: iac/local
        run: cp .env.example .env

      - name: Build the application image
        working-directory: iac/local
        run: docker compose build app

      # tofu talks to these three: keycloak.tf to Keycloak, storage.tf to Azurite
      # (via the az CLI, preinstalled on the runner), database.tf via `docker exec`
      # into the SQL Server container. Bring them up before provisioning.
      - name: Start backing services
        working-directory: iac/local
        run: docker compose up -d --wait --wait-timeout 300 mssql keycloak azurite telemetry

      - name: Provision realm, storage and database schema
        working-directory: iac/tofu
        run: |
          tofu init -input=false
          tofu apply -auto-approve -input=false

      - name: Start the application and edge
        working-directory: iac/local
        run: docker compose up -d --wait --wait-timeout 300 app edge website

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health/ready; then
              echo; echo "ready after attempt ${attempt}"; exit 0
            fi
            echo "not ready yet (${attempt}/40)"; sleep 5
          done
          echo "the application never reported ready"; exit 1

      - name: Build test projects
        run: >
          dotnet build UA.Action.Freedom.slnx
          --configuration ${{ env.CONFIGURATION }}

      - name: Integration tests (Dapper repository against SQL Server)
        run: >
          dotnet test
          --project tests/UA.Action.Freedom.Tests.Integration/UA.Action.Freedom.Tests.Integration.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --verbosity normal

      - name: BDD tests (feature scenarios against the running containers)
        run: >
          dotnet test
          --project tests/UA.Action.Freedom.Tests.BDD/UA.Action.Freedom.Tests.BDD.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --verbosity normal

      - name: Container logs
        if: failure()
        working-directory: iac/local
        run: docker compose logs --no-color --tail 400

      - name: Tear down
        if: always()
        working-directory: iac/local
        run: docker compose down -v

  publish:
    needs: [build-and-test, acceptance]
    runs-on: ubuntu-latest
    # Skip on PRs originating from forks: they have a read-only token and no package write access.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    env:
      PACKAGE_VERSION: ${{ needs.build-and-test.outputs.packageVersion }}
      IS_RELEASE: ${{ needs.build-and-test.outputs.isRelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # Repopulates the NuGet cache and obj/*.nuget.g.* so MSBuild can evaluate
      # the projects during pack. Does not rebuild — pack runs with --no-build
      # and reuses the binaries produced by the build-and-test job.
      - name: Restore
        run: dotnet restore UA.Action.Freedom.slnx

      - name: Pack
        run: |
          for proj in ${{ env.PACKABLE_PROJECTS }}; do
            dotnet pack "$proj" \
              --configuration ${{ env.CONFIGURATION }} \
              --no-build \
              --no-restore \
              -p:PackageVersion=${PACKAGE_VERSION} \
              --output ./artifacts
          done

      - name: Push package to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Create GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "v${PACKAGE_VERSION}"
          ./artifacts/*.nupkg
          --title "v${PACKAGE_VERSION}"
          --generate-notes
          --target ${{ github.sha }}
