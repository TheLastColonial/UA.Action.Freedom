                          example: 18AT320000TVWJYM68
                        isTSAD:
                          type: boolean
                          description: "Set to true if the transit declaration is\
                            \ a TSAD, otherwise set to false (for a TAD)"
                          example: false
                        sAndSMasterRefNum:
                          description: "The master reference number or Movement Reference\
                            \ Number (MRN) for a Safety & Security declaration, where\
                            \ applicable. This must be supplied when the S&S declaration\
                            \ covers individual Transit consignments within a trailer.\
                            \ This applies to both ENS and EXS declarations. If there\
                            \ is one, include the S&S MRN for the Transit declaration\
                            \ above here. ENS will accept both the format of ICS2\
                            \ and ICSNI MRNs in GB_TO_NI direction."
                          oneOf:
                          - pattern: "^[A-Z0-9-)(/]{1,200}$"
                            type: string
                            description: "The master reference number (MRN) for a\
                              \ Safety & Security declaration, where applicable."
                            example: GB12323020392
                      additionalProperties: false
                  tirDeclarations:
                    minItems: 1
                    type: array
                    description: Details of one or more TIR Carnet declarations.  Must
