  /customs/goods-movement-system/reference-data:
    get:
      description: "This endpoint gets details of all reference data used by GVMS.\n\
        \nReference data includes lists of:\n\n* Carriers operating on GVMS routes\n\
        * Ports operating GVMS routes \n* GVMS routes (combining a carrier and a pair\
        \ of ports\n* Validation rule failure codes and descriptions\n\nThe reference\
        \ data is returned as a single JSON document containing all required data\
        \ lists.\nNew carriers, routes, ports and locations will be added with effective\
        \ from and to dates, so your software will have an advance view of upcoming\
        \ changes.  It should not offer up routes that are not yet in effect or that\
        \ have expired.\n\nGVMS reference data is updated periodically. If you are\
        \ a GVMS API subscriber, you will receive notifications about upcoming updates.\
        \ If you receive a notification about an update, your application software\
        \ must refresh the reference data by calling the GET reference-data endpoint.\n"
      operationId: Get reference data
      parameters:
      - name: Accept
        in: header
        description: "Specifies the response format and the [version](/api-documentation/docs/reference-guide#versioning)\
          \ of the API to be used."
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      responses:
        "200":
          description: GMVS reference data is returned in the response body
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: array
                    description: The routes covered by GVMS
                    items:
                      required:
                      - arrivalPortId
                      - carrierId
                      - departurePortId
                      - routeDirection
                      - routeEffectiveFrom
                      - routeId
                      type: object
                      properties:
                        routeId:
                          type: string
                          description: The route identifier
                        routeDirection:
                          type: string
                          description: The direction of the route
                          enum:
                          - UK_INBOUND
                          - UK_OUTBOUND
                          - GB_TO_NI
                          - NI_TO_GB
                        routeEffectiveFrom:
                          type: string
                          description: Date the route came into effect
                          format: date
                        departurePortId:
                          type: integer
                          description: The id of the departure port
                        arrivalPortId:
                          type: integer
                          description: The id of the arrival port
                        carrierId:
                          type: integer
                          description: the id of the carrier operating that route
                        routeEffectiveTo:
                          type: string
                          description: The date the route stopped being used
                          format: date
                  ports:
                    type: array
                    items:
                      required:
                      - officeOfTransitCustomsOfficeCode
                      - portCountryCode
                      - portDescription
                      - portEffectiveFrom
                      - portId
                      type: object
                      properties:
                        portId:
                          type: integer
                          description: The id of the port
                        portRegion:
                          type: string
                          description: The region the port is grouped into for CTC
                        portEffectiveFrom:
                          type: string
                          description: The date the port came into effect
                          format: date
                        portDescription:
                          maxLength: 255
                          minLength: 3
                          type: string
                          description: "Description of the port eg: the ports name"
                        timezoneId:
                          maxLength: 50
                          type: string
                          description: The UTC Identifier
                        chiefPortCode:
                          type: string
                          description: The port code specific to CHIEF
                        cdsPortCode:
                          type: string
                          description: The port code specific to CDS
                        officeOfTransitCustomsOfficeCode:
                          maxLength: 8
                          minLength: 8
                          type: string
                          description: Customs office code for CTC
                        portEffectiveTo:
                          type: string
                          description: The date the port stopped being used
                          format: date
                        portCountryCode:
                          pattern: "^[A-Z]{2}$"
                          type: string
                          description: The Country code of the associated Port
                        isOperatingArrivedExportsProcess:
                          type: boolean
                          description: "If true, indicates that this port is operating\
                            \ the arrived exports process and as such requires all\
                            \ customs export declarations to be pre-arrived prior\
                            \ to check-in.  If omitted or false, indicates that this\
                            \ port is operating the standard exports process."
                  carriers:
                    type: array
                    items:
                      required:
                      - carrierId
                      - carrierName
                      type: object
                      properties:
                        carrierId:
                          type: integer
                          description: The id of the carrier
                        carrierName:
                          maxLength: 255
                          minLength: 1
                          type: string
                          description: The name of the carrier
                        countryCode:
                          pattern: "^[A-Z]{2}$"
                          type: string
                          description: The country code where the carrier is registered
                  locations:
                    type: array
                    items:
                      required:
                      - address
                      - locationDescription
                      - locationEffectiveFrom
                      - locationId
                      - locationType
                      - requiredInspectionLocations
                      - supportedDirections
                      - supportedInspectionTypeIds
                      type: object
                      properties:
                        locationId:
                          type: string
                          description: The id of the inspection facility.
                        locationDescription:
                          type: string
                          description: The name of the inspection facility location.
                        address:
                          required:
                          - lines
                          - postcode
                          type: object
                          properties:
                            lines:
                              maxItems: 4
                              minItems: 1
                              type: array
                              description: "The building name or number, and street\
                                \ name where the inspection facility is located."
                              items:
                                type: string
                            town:
                              type: string
                              description: The town where the inspection facility
                                is located.
                            postcode:
                              type: string
                              description: The postcode where the inspection facility
                                is located.
                          description: The address where the inspection facility is
                            located.
                        locationType:
                          type: string
                          description: "The type of inspection facility; either Inland\
                            \ Border Facility (IBF), Border Control Post (BCP) or\
                            \ a facility that carries out all inspection types (ALL)."
                          enum:
                          - IBF
                          - BCP
                          - ALL
                        supportedDirections:
                          maxItems: 4
                          minItems: 1
                          type: array
                          description: The directions of travel supported by the location.
                          items:
                            type: string
                            enum:
                            - UK_INBOUND
                            - UK_OUTBOUND
                            - GB_TO_NI
                            - NI_TO_GB
                        locationEffectiveFrom:
                          type: string
                          description: The date the inspection facility location starts
                            being used.
                          format: date
                        locationEffectiveTo:
                          type: string
                          description: The date the inspection facility location stops
                            being used.
                          format: date
                        supportedInspectionTypeIds:
                          minItems: 1
                          type: array
                          description: The list of inspectionTypeIds for the types
                            of inspections carried out.
                          items:
                            type: string
                        requiredInspectionLocations:
                          minItems: 1
                          type: array
                          description: The list of portIds that the inspection facility
                            supports.
                          items:
                            type: integer
                  inspectionTypes:
                    type: array
                    items:
                      required:
                      - description
                      - inspectionTypeId
                      type: object
                      properties:
                        inspectionTypeId:
                          type: string
                          description: The id of the type of inspection that needs
                            to be performed on the vehicle.
                        description:
                          type: string
                          description: "The category of the type of inspection that\
                            \ needs to be performed on the vehicle e.g. CUSTOMS, DEFRA\
                            \ or TRANSIT."
                  ruleFailures:
                    type: array
                    description: The list of business and other possible rule failures
                      within a GMR
                    items:
                      required:
                      - ruleDescription
                      - ruleId
                      type: object
                      properties:
                        ruleId:
                          type: string
                        ruleDescription:
                          type: string
              examples:
                example-1:
                  value:
                    routes:
                    - routeId: "80"
                      routeEffectiveFrom: 2020-12-01
                      departurePortId: 1765
                      routeDirection: UK_OUTBOUND
                      arrivalPortId: 2183
                      carrierId: 1
                    - routeId: "103"
                      routeEffectiveFrom: 2020-12-01
                      departurePortId: 7054
                      routeDirection: UK_OUTBOUND
                      arrivalPortId: 1401
                      carrierId: 2
                    ports:
                    - portId: 1777
                      portRegion: Northeast
                      portEffectiveFrom: 2000-01-01
                      portDescription: Newcastle-Upon-Tyne
                      chiefPortCode: TYN
                      cdsPortCode: NCLLAOCSE
                      officeOfTransitCustomsOfficeCode: GB000218
                      timezoneId: Europe/London
                      portCountryCode: GB
                    - portId: 1824
                      portRegion: South
                      portEffectiveFrom: 2000-01-01
                      portDescription: Newhaven
                      chiefPortCode: NHV
                      cdsPortCode: NHVNHVNHV
                      officeOfTransitCustomsOfficeCode: GB003250
                      timezoneId: Europe/London
                      portCountryCode: GB
                    carriers:
                    - carrierId: 1
                      carrierName: Stena Line
                      countryCode: SE
                    - carrierId: 2
                      carrierName: DFDS Seaways
                      countryCode: DK
                    ruleFailures:
                    - ruleId: '001_1'
                      ruleDescription: This type of declaration cannot be used for
                        this direction of travel
                    - ruleId: '001_3'
                      ruleDescription: This type of declaration cannot be used in
                        this GMR based on the Haulier type you selected. Check and
                        try again.
      security:
      - {}
components:
  schemas:
    gmrId:
      pattern: "^GMR[A-Z][0-9A-Z]{8}$"
      type: string
      description: The Goods Movement Record (GMR) ID for this GMR.  Do not include
        when POSTing a GMR - GVMS will assign an ID.
      example: GMRA000002JR
    direction:
      type: string
      description: "The direction of the movement - into or out of the UK, or between\
        \ Great Britain and Northern Ireland"
      oneOf:
      - title: UK_INBOUND
        type: string
        description: The movement is travelling into the UK
        enum:
        - UK_INBOUND
      - title: UK_OUTBOUND
        type: string
        description: The movement is travelling out of the UK
        enum:
        - UK_OUTBOUND
      - title: GB_TO_NI
        type: string
        description: The movement is travelling out of Great Britain into Northern
          Ireland
        enum:
        - GB_TO_NI
      - title: NI_TO_GB
        type: string
        description: The movement is travelling out of Northern Ireland into Great
          Britain
        enum:
        - NI_TO_GB
    isUnaccompanied:
      type: boolean
      description: "Set to true if the vehicle will not be accompanying the trailer(s)\
        \ during the crossing, or if the vehicle is carrying a container that will\
        \ be detached and loaded for the crossing."
      example: false
    inspectionRequired:
      type: boolean
      description: "If set to true, indicates that the vehicle requires a customs\
        \ inspection.  If set to false, indicates that the vehicle does not require\
        \ a customs inspection.  If not set, indicates the customs inspection decision\
        \ has not yet been made or is not applicable.  For outbound GMRs, this indicates\
        \ that the vehicle must present at an inspection facility prior to checking-in\
        \ at the port.  For Office of Transit inspections for inbound GMRs, a decision\
        \ may be made to inspect subsequent to a notification that inspection is not\
        \ required.  In this event a notification will be sent that changes inspectionRequired\
        \ from false to true.  If this happens after leaving the port of arrival,\
        \ the inspection should be carried out at the next transit office e.g. the\
        \ office of destination."
    reportToLocations:
      minItems: 1
      type: array
      description: "A list of one or more inspection types, from GVMS Reference Data,\
        \ that the vehicle must have carried out, in the order specified.  This means\
        \ that where there are multiple entries here, the vehicle must report for\
        \ the first inspection type listed before each subsequent listed inspection.\
        \  Each entry includes a list of available locations for the inspection type."
      items:
        required:
        - inspectionTypeId
        - locationIds
        type: object
        properties:
          inspectionTypeId:
            pattern: "^[0-9A-Za-z\\-_]{1,100}$"
            type: string
            description: An inspectionTypeId from GVMS Reference Data denoting the
              type of inspection that needs to be performed on the vehicle.
            example: "7"
          locationIds:
            type: array
            description: A list of locationIds from GVMS Reference Data that are available
              to perform this type of inspection.
            example: L0029A
            items:
              pattern: "^[0-9A-Za-z\\-_]{1,100}$"
              type: string
        description: Information about an inspection that is required
        example:
          inspectionTypeId: "1"
          locationIds:
          - L0029A
          - L0030A
    vehicleRegNum:
      pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,30})?$"
      type: string
      description: Vehicle registration number of the vehicle that will arrive at
        port.  If isUnaccompanied is set to false then vehicleRegNum must be provided
        to check-in.
      example: AB19 DEF
    trailerRegistrationNums:
      maxItems: 2
      minItems: 1
      uniqueItems: true
      type: array
      description: "For vehicles carrying trailers, the trailer registration number\
        \ of each trailer.  If isUnaccompanied is set to true then trailerRegistrationNums\
        \ or containerReferenceNums must be provided before check-in."
      items:
        pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
        type: string
        example: A1234567
    containerReferenceNums:
      minItems: 1
      uniqueItems: true
      type: array
      description: "For vehicles arriving with containers that will be detached and\
        \ loaded, the container reference number of each container in the movement.\
        \ If isUnaccompanied is set to true then trailerRegistrationNums or containerReferenceNums\
        \ must be provided before check-in."
      items:
        pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
        type: string
        example: CSQU3054383
    state:
      type: string
      description: The state of the GMR
      example: NOT_FINALISABLE
      oneOf:
      - title: NOT_FINALISABLE
        type: string
        description: The GMR is in a non-finalisable state.  This means an update
          will be required from the haulier prior to check-in.
        enum:
        - NOT_FINALISABLE
      - title: OPEN
        type: string
        description: The GMR is open for updates and is ready for check-in.
        enum:
        - OPEN
      - title: CHECKED_IN
        type: string
        description: "The GMR is checked-in, awaiting embarkation confirmation from\
          \ the carrier."
        enum:
        - CHECKED_IN
      - title: EMBARKED
        type: string
        description: "The GMR is embarked, meaning the goods movement has embarked\
          \ on its crossing but the goods are awaiting clearance to proceed."
        enum:
        - EMBARKED
      - title: COMPLETED
        type: string
        description: "The GMR is completed, meaning the goods movement has embarked\
          \ on its crossing and the goods are clear to proceed."
        enum:
        - COMPLETED
    createdDateTime:
      pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\d.\\d{3}Z$"
      type: string
      description: The date and time that this GMR was created.
      example: 2021-08-11T10:58:12
    updatedDateTime:
      pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\d.\\d{3}Z$"
      type: string
      description: The date and time that this GMR was last updated.
      example: 2021-08-12T15:34:02
    routeId:
      pattern: "^[A-Z0-9-]{1,200}$"
      type: string
      description: "The ID of the crossing route, using a routeId from the GVMS reference\
        \ data"
      example: "18273"
      default: ""
    localDateTimeOfDeparture:
      pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
      type: string
      description: "The planned date and time of departure, in local time of the departure\
        \ port. Must not include seconds, time zone or UTC marker"
      example: 2021-08-11T10:58
    plannedCrossing:
      required:
      - routeId
      type: object
      properties:
        routeId:
          pattern: "^[A-Z0-9-]{1,200}$"
          type: string
          description: "The ID of the crossing route, using a routeId from the GVMS\
            \ reference data"
          example: "18273"
          default: ""
        localDateTimeOfDeparture:
          pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
          type: string
          description: "The planned date and time of departure, in local time of the\
            \ departure port. Must not include seconds, time zone or UTC marker"
          example: 2021-08-11T10:58
      additionalProperties: false
      description: Details of the planned crossing.
    localDateTimeOfArrival:
      pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
      type: string
      description: "The planned date and time of arrival, in local time of the arrival\
        \ port. Must not include seconds, time zone or UTC marker"
      example: 2021-08-11T10:58
    checkedInCrossing:
      required:
      - localDateTimeOfArrival
      - routeId
      type: object
      properties:
        routeId:
          pattern: "^[A-Z0-9-]{1,200}$"
          type: string
          description: "The ID of the crossing route, using a routeId from the GVMS\
            \ reference data"
          example: "18273"
          default: ""
        localDateTimeOfArrival:
          pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
          type: string
          description: "The planned date and time of arrival, in local time of the\
            \ arrival port. Must not include seconds, time zone or UTC marker"
          example: 2021-08-11T10:58
      additionalProperties: false
      description: Details of the crossing that the vehicle has been checked-in to.
        These details will only be present in the Goods Movement Record after the
        vehicle has checked in.
    actualCrossing:
      required:
      - localDateTimeOfArrival
      - routeId
      type: object
      properties:
        routeId:
          pattern: "^[A-Z0-9-]{1,200}$"
          type: string
          description: "The ID of the crossing route, using a routeId from the GVMS\
            \ reference data"
          example: "18273"
          default: ""
        localDateTimeOfArrival:
          pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
          type: string
          description: "The planned date and time of arrival, in local time of the\
            \ arrival port. Must not include seconds, time zone or UTC marker"
          example: 2021-08-11T10:58
      additionalProperties: false
      description: Details of the crossing that the goods movement has been embarked
        on. These details will only be present in the Goods Movement Record after
        the vehicle has embarked on a crossing.
    definitions:
      type: array
      items:
        required:
        - createdDateTime
        - direction
        - gmrId
        - state
        - updatedDateTime
        type: object
        properties:
          gmrId:
            pattern: "^GMR[A-Z][0-9A-Z]{8}$"
            type: string
            description: The Goods Movement Record (GMR) ID for this GMR.  Do not
              include when POSTing a GMR - GVMS will assign an ID.
            example: GMRA000002JR
          direction:
            type: string
            description: "The direction of the movement - into or out of the UK, or\
              \ between Great Britain and Northern Ireland"
            oneOf:
            - title: UK_INBOUND
              type: string
              description: The movement is travelling into the UK
              enum:
              - UK_INBOUND
            - title: UK_OUTBOUND
              type: string
              description: The movement is travelling out of the UK
              enum:
              - UK_OUTBOUND
            - title: GB_TO_NI
              type: string
              description: The movement is travelling out of Great Britain into Northern
                Ireland
              enum:
              - GB_TO_NI
            - title: NI_TO_GB
              type: string
              description: The movement is travelling out of Northern Ireland into
                Great Britain
              enum:
              - NI_TO_GB
          isUnaccompanied:
            type: boolean
            description: "Set to true if the vehicle will not be accompanying the\
              \ trailer(s) during the crossing, or if the vehicle is carrying a container\
              \ that will be detached and loaded for the crossing."
            example: false
          inspectionRequired:
            type: boolean
            description: "If set to true, indicates that the vehicle requires a customs\
              \ inspection.  If set to false, indicates that the vehicle does not\
              \ require a customs inspection.  If not set, indicates the customs inspection\
              \ decision has not yet been made or is not applicable.  For outbound\
              \ GMRs, this indicates that the vehicle must present at an inspection\
              \ facility prior to checking-in at the port.  For Office of Transit\
              \ inspections for inbound GMRs, a decision may be made to inspect subsequent\
              \ to a notification that inspection is not required.  In this event\
              \ a notification will be sent that changes inspectionRequired from false\
              \ to true.  If this happens after leaving the port of arrival, the inspection\
              \ should be carried out at the next transit office e.g. the office of\
              \ destination."
          reportToLocations:
            minItems: 1
            type: array
            description: "A list of one or more inspection types, from GVMS Reference\
              \ Data, that the vehicle must have carried out, in the order specified.\
              \  This means that where there are multiple entries here, the vehicle\
              \ must report for the first inspection type listed before each subsequent\
              \ listed inspection.  Each entry includes a list of available locations\
              \ for the inspection type."
            items:
              required:
              - inspectionTypeId
              - locationIds
              type: object
              properties:
                inspectionTypeId:
                  pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                  type: string
                  description: An inspectionTypeId from GVMS Reference Data denoting
                    the type of inspection that needs to be performed on the vehicle.
                  example: "7"
                locationIds:
                  type: array
                  description: A list of locationIds from GVMS Reference Data that
                    are available to perform this type of inspection.
                  example: L0029A
                  items:
                    pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                    type: string
              description: Information about an inspection that is required
              example:
                inspectionTypeId: "1"
                locationIds:
                - L0029A
                - L0030A
          vehicleRegNum:
            pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,30})?$"
            type: string
            description: Vehicle registration number of the vehicle that will arrive
              at port.  If isUnaccompanied is set to false then vehicleRegNum must
              be provided to check-in.
            example: AB19 DEF
          trailerRegistrationNums:
            maxItems: 2
            minItems: 1
            uniqueItems: true
            type: array
            description: "For vehicles carrying trailers, the trailer registration\
              \ number of each trailer.  If isUnaccompanied is set to true then trailerRegistrationNums\
              \ or containerReferenceNums must be provided before check-in."
            items:
              pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
              type: string
              example: A1234567
          containerReferenceNums:
            minItems: 1
            uniqueItems: true
            type: array
            description: "For vehicles arriving with containers that will be detached\
              \ and loaded, the container reference number of each container in the\
              \ movement. If isUnaccompanied is set to true then trailerRegistrationNums\
              \ or containerReferenceNums must be provided before check-in."
            items:
              pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
              type: string
              example: CSQU3054383
          state:
            type: string
            description: The state of the GMR
            example: NOT_FINALISABLE
            oneOf:
            - title: NOT_FINALISABLE
              type: string
              description: The GMR is in a non-finalisable state.  This means an update
                will be required from the haulier prior to check-in.
              enum:
              - NOT_FINALISABLE
            - title: OPEN
              type: string
              description: The GMR is open for updates and is ready for check-in.
              enum:
              - OPEN
            - title: CHECKED_IN
              type: string
              description: "The GMR is checked-in, awaiting embarkation confirmation\
                \ from the carrier."
              enum:
              - CHECKED_IN
            - title: EMBARKED
              type: string
              description: "The GMR is embarked, meaning the goods movement has embarked\
                \ on its crossing but the goods are awaiting clearance to proceed."
              enum:
              - EMBARKED
            - title: COMPLETED
              type: string
              description: "The GMR is completed, meaning the goods movement has embarked\
                \ on its crossing and the goods are clear to proceed."
              enum:
              - COMPLETED
          createdDateTime:
            pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\d.\\d{3}Z$"
            type: string
            description: The date and time that this GMR was created.
            example: 2021-08-11T10:58:12
          updatedDateTime:
            pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\d.\\d{3}Z$"
            type: string
            description: The date and time that this GMR was last updated.
            example: 2021-08-12T15:34:02
          plannedCrossing:
            required:
            - routeId
            type: object
            properties:
              routeId:
                pattern: "^[A-Z0-9-]{1,200}$"
                type: string
                description: "The ID of the crossing route, using a routeId from the\
                  \ GVMS reference data"
                example: "18273"
                default: ""
              localDateTimeOfDeparture:
                pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                type: string
                description: "The planned date and time of departure, in local time\
                  \ of the departure port. Must not include seconds, time zone or\
                  \ UTC marker"
                example: 2021-08-11T10:58
            additionalProperties: false
            description: Details of the planned crossing.
          checkedInCrossing:
            required:
            - localDateTimeOfArrival
            - routeId
            type: object
            properties:
              routeId:
                pattern: "^[A-Z0-9-]{1,200}$"
                type: string
                description: "The ID of the crossing route, using a routeId from the\
                  \ GVMS reference data"
                example: "18273"
                default: ""
              localDateTimeOfArrival:
                pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                type: string
                description: "The planned date and time of arrival, in local time\
                  \ of the arrival port. Must not include seconds, time zone or UTC\
                  \ marker"
                example: 2021-08-11T10:58
            additionalProperties: false
            description: Details of the crossing that the vehicle has been checked-in
              to. These details will only be present in the Goods Movement Record
              after the vehicle has checked in.
          actualCrossing:
            required:
            - localDateTimeOfArrival
            - routeId
            type: object
            properties:
              routeId:
                pattern: "^[A-Z0-9-]{1,200}$"
                type: string
                description: "The ID of the crossing route, using a routeId from the\
                  \ GVMS reference data"
                example: "18273"
                default: ""
              localDateTimeOfArrival:
                pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                type: string
                description: "The planned date and time of arrival, in local time\
                  \ of the arrival port. Must not include seconds, time zone or UTC\
                  \ marker"
                example: 2021-08-11T10:58
            additionalProperties: false
            description: Details of the crossing that the goods movement has been
              embarked on. These details will only be present in the Goods Movement
              Record after the vehicle has embarked on a crossing.
          links:
            type: array
            description: A list of endpoint links that indicate possible actions related
              to the current resource
            items:
              required:
              - href
              - method
              - rel
              type: object
              properties:
                href:
                  type: string
                  description: The relative URL of the endpoint
                  example: /customs/goods-movement-system/movements/GMRB-0000-0A9C
                method:
                  type: string
                  description: The HTTP method type for the endpoint
                  example: GET
                  oneOf:
                  - title: GET
                    type: string
                    description: The HTTP method for the endpoint
                    enum:
                    - GET
                rel:
                  type: string
                  description: "A label for the endpoint, which describes how it is\
                    \ related to the current resource. The rel will be self where\
                    \ the action is retrieval of the same resource."
                  example: get-goods-movement-record
                  oneOf:
                  - title: get-goods-movement-record
                    type: string
                    description: "A label for the endpoint, which describes how it\
                      \ is related to the current resource. The rel will be self where\
                      \ the action is retrieval of the same resource."
                    enum:
                    - get-goods-movement-record
              description: An endpoint link that indicates a possible action related
                to the current resource
              example:
                rel: get-goods-movement-record
                href: /customs/goods-movement-system/movements/GMRB00000A9C
                method: GET
    error-response_definitions:
      title: error-response
      required:
      - code
      type: object
      properties:
        code:
          type: string
    haulierType:
      type: string
      description: The type of haulier moving the goods
      example: STANDARD
      oneOf:
      - title: STANDARD
        type: string
        description: All hauliers that are not one of the other types
        enum:
        - STANDARD
      - title: FPO_ASN
        type: string
        description: Fast parcel operators that are members of the Anti-Smuggling
          Network
        enum:
        - FPO_ASN
      - title: FPO_OTHER
        type: string
        description: Fast parcel operators that are not members of the ASN and are
          not moving goods with a Memorandum of Understanding
        enum:
        - FPO_OTHER
      - title: NATO_MOD
        type: string
        description: NATO or MoD
        enum:
        - NATO_MOD
      - title: RMG
        type: string
        description: Royal Mail Group
        enum:
        - RMG
      - title: ETOE
        type: string
        description: Extra-Territorial Office of Exchange
        enum:
        - ETOE
    sAndSMasterRefNum:
      pattern: "^[A-Z0-9-)(/]{1,200}$"
      type: string
      description: "The master reference number (MRN) for a Safety & Security declaration,\
        \ where applicable."
      example: GB12323020392
    sAndSMasterRefNums:
      maxItems: 2500
      minItems: 1
      uniqueItems: true
      type: array
      description: The master reference numbers or Movement Reference Numbers (MRNs)
        for Safety & Security declarations - should be supplied where applicable.
      items:
        required:
        - masterRefNum
        type: object
        properties:
          masterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: "The master reference number (MRN) for a Safety & Security\
              \ declaration, where applicable."
            example: GB12323020392
    customsDeclarationId:
      pattern: "^[A-Z0-9-)(/]{1,200}$"
      type: string
      description: |-
        This is the identifier for a customs declaration from Customs Declaration Service (CDS).

        For inbound movements declared in CDS it is a MRN, for example 19GB4S24GC3PPFGVR7.

        For outbound movements declared in CDS it is a DUCR, for example 0GB689223596000-SE119404.
      example: 19GB4S24GC3PPFGVR7
    customsDeclarations:
      minItems: 1
      type: array
      description: Details of the customs declarations within this goods load.
      items:
        required:
        - customsDeclarationId
        type: object
        properties:
          customsDeclarationId:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: |-
              This is the identifier for a customs declaration from Customs Declaration Service (CDS).

              For inbound movements declared in CDS it is a MRN, for example 19GB4S24GC3PPFGVR7.

              For outbound movements declared in CDS it is a DUCR, for example 0GB689223596000-SE119404.
            example: 19GB4S24GC3PPFGVR7
          sAndSMasterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: "The master reference number or Movement Reference Number\
              \ (MRN) for a Safety & Security declaration, where applicable. This\
              \ must be supplied when the S&S declaration covers individual consignments\
              \ within a trailer. This applies to both ENS and EXS declarations. If\
              \ there is one, include the S&S MRN for the customs declaration above\
              \ here. ENS will accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
              \ direction"
            example:
            - GB12323020392
        additionalProperties: false
    mtpGoods:
      minItems: 1
      type: array
      description: References for goods loads moving under a stamped paper MTP.
      items:
        required:
        - sAndSMasterRefNum
        type: object
        properties:
          sAndSMasterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: "The master reference number or Movement Reference Number\
              \ (MRN) for a Safety & Security declaration, where applicable. This\
              \ must be supplied when the S&S declaration covers individual Transit\
              \ consignments within a trailer. This applies to both ENS and EXS declarations.\
              \ If there is one, include the S&S MRN for the MTP declaration above\
              \ here. ENS will accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
              \ direction."
            example:
            - GB12323020392
        additionalProperties: false
    mtpDeclaration:
      type: object
      properties:
        mtpGoods:
          minItems: 1
          type: array
          description: References for goods loads moving under a stamped paper MTP.
          items:
            required:
            - sAndSMasterRefNum
            type: object
            properties:
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual Transit\
                  \ consignments within a trailer. This applies to both ENS and EXS\
                  \ declarations. If there is one, include the S&S MRN for the MTP\
                  \ declaration above here. ENS will accept both the format of ICS2\
                  \ and ICSNI MRNs in GB_TO_NI direction."
                example:
                - GB12323020392
            additionalProperties: false
      additionalProperties: false
      description: "Details of a stamped, paper-based declaration using a Manual Transit\
        \ Procedure (MTP).  Only intended for use when technical issues prevent use\
        \ of Transit IT systems."
    transitDeclarationId:
      pattern: "^\\d{2}[A-Z]{2}[A-Z0-9]{14}$"
      type: string
      description: This is the Transit MRN issued by the Office of Departure.  Must
        be provided.
      example: 18AT320000TVWJYM68
    isTSAD:
      type: boolean
      description: "Set to true if the transit declaration is a TSAD, otherwise set\
        \ to false (for a TAD)"
      example: false
    transitDeclarations:
      minItems: 1
      type: array
      description: Details of the transit declarations within this goods load.
      items:
        required:
        - isTSAD
        - transitDeclarationId
        type: object
        properties:
          transitDeclarationId:
            pattern: "^\\d{2}[A-Z]{2}[A-Z0-9]{14}$"
            type: string
            description: This is the Transit MRN issued by the Office of Departure.  Must
              be provided.
            example: 18AT320000TVWJYM68
          isTSAD:
            type: boolean
            description: "Set to true if the transit declaration is a TSAD, otherwise\
              \ set to false (for a TAD)"
            example: false
          sAndSMasterRefNum:
            description: "The master reference number or Movement Reference Number\
              \ (MRN) for a Safety & Security declaration, where applicable. This\
              \ must be supplied when the S&S declaration covers individual Transit\
              \ consignments within a trailer. This applies to both ENS and EXS declarations.\
              \ If there is one, include the S&S MRN for the Transit declaration above\
              \ here. ENS will accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
              \ direction."
            oneOf:
            - pattern: "^[A-Z0-9-)(/]{1,200}$"
              type: string
              description: "The master reference number (MRN) for a Safety & Security\
                \ declaration, where applicable."
              example: GB12323020392
        additionalProperties: false
    tirCarnetId:
      pattern: "^.{1,200}$"
      type: string
      description: The TIR Carnet ID for the carnet within a TIR goods movement
      example: ABC/123
    tirDeclarations:
      minItems: 1
      type: array
      description: Details of one or more TIR Carnet declarations.  Must be provided
        prior to check-in for TIR movements.
      items:
        required:
        - tirCarnetId
        type: object
        properties:
          tirCarnetId:
            pattern: "^.{1,200}$"
            type: string
            description: The TIR Carnet ID for the carnet within a TIR goods movement
            example: ABC/123
          sAndSMasterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: "The master reference number or Movement Reference Number\
              \ (MRN) for a Safety & Security declaration, where applicable. This\
              \ must be supplied when the S&S declaration covers TIR Carnet consignments\
              \ within a trailer. This applies to both ENS and EXS declarations. If\
              \ there is one, include the S&S MRN for the TIR declaration above here.\
              \ ENS will accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
              \ direction."
            example:
            - GB12323020392
        additionalProperties: false
    ataCarnetId:
      pattern: "^.{1,200}$"
      type: string
      description: The ATA Carnet ID for the carnet within an ATA goods movement
      example: ABC/123
    ataDeclarations:
      minItems: 1
      type: array
      description: Details of one or more ATA Carnet declarations.  Must be provided
        prior to check-in for ATA movements.
      items:
        required:
        - ataCarnetId
        type: object
        properties:
          ataCarnetId:
            pattern: "^.{1,200}$"
            type: string
            description: The ATA Carnet ID for the carnet within an ATA goods movement
            example: ABC/123
          sAndSMasterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: "The master reference number or Movement Reference Number\
              \ (MRN) for a Safety & Security declaration, where applicable. This\
              \ must be supplied when the S&S declaration covers ATA Carnet consignments\
              \ within a trailer. This applies to both ENS and EXS declarations. If\
              \ there is one, include the S&S MRN for the ATA declaration above here.\
              \ ENS will accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
              \ direction."
            example:
            - GB12323020392
        additionalProperties: false
    localReferenceNumber:
      pattern: "^[A-Z0-9]{1,22}$"
      type: string
      description: It is only used for EIDR and UKIMS EIDR declarations in the GB_TO_NI
        direction
    procedureCode:
      pattern: "^[0-9]{4}$"
      type: string
      description: It is only used for EIDR declarations in the GB_TO_NI direction
    eidrDeclarations:
      minItems: 1
      type: array
      description: "Details of one or more EIDR declarations.  Must be provided prior\
        \ to check-in for EIDR movements.  For movements using a specially-issued\
        \ EORI, the same EORI may be entered multiple times, one entry for each ENS\
        \ S&S MRN travelling under EIDR."
      items:
        required:
        - traderEORI
        type: object
        properties:
          traderEORI:
            pattern: "^(?:(?:GB|XI)[0-9]{12,15}|(?!GB|XI)[A-Z]{2}[0-9A-Z]{1,15})$"
            type: string
            description: "The trader's EORI, GB EORIs are valid for all direction\
              \ movements, XI and EU EORIs are valid for only GB to NI movements."
          sAndSMasterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: "The master reference number or Movement Reference Number\
              \ (MRN) for a Safety & Security declaration, where applicable. This\
              \ must be supplied when the S&S declaration covers individual EIDR consignments\
              \ within a trailer. This applies to both ENS and EXS declarations. If\
              \ there is one, include the S&S MRN for the EIDR declaration above here.\
              \ ENS will accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
              \ direction."
            example:
            - GB12323020392
          localReferenceNumber:
            pattern: "^[A-Z0-9]{1,22}$"
            type: string
            description: It is only used for EIDR and UKIMS EIDR declarations in the
              GB_TO_NI direction
          procedureCode:
            pattern: "^[0-9]{4}$"
            type: string
            description: It is only used for EIDR declarations in the GB_TO_NI direction
        additionalProperties: false
    ukimsEidrDeclarations:
      minItems: 1
      type: array
      description: Details of one or more UKIMS EIDR declarations.
      items:
        required:
        - traderEORI
        type: object
        properties:
          traderEORI:
            pattern: "^[A-Z]{2}[0-9]{12,15}$"
            type: string
            description: "The trader's EORI, only XI EORIs are valid."
          nopWaiver:
            type: boolean
          localReferenceNumber:
            pattern: "^[A-Z0-9]{1,22}$"
            type: string
            description: It is only used for EIDR and UKIMS EIDR declarations in the
              GB_TO_NI direction
          sAndSMasterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: "The master reference number or Movement Reference Number\
              \ (MRN) for a Safety & Security declaration, where applicable. This\
              \ must be supplied when the S&S declaration covers individual UKIMS\
              \ EIDR consignments within a trailer. This applies to both ENS and EXS\
              \ declarations. If there is one, include the S&S MRN for the UKIMS EIDR\
              \ declaration above here."
            example:
            - GB12323020392
        additionalProperties: false
    eadMasterRefNum:
      pattern: "^\\d{2}(?!GB|XI)[A-Z]{2}[A-Z0-9]{14}$"
      type: string
      description: The master or movement reference number (MRN) of the Export Accompanying
        Document (EAD) for this indirect export.
      example: 19IE294000AFGRIG29
    indirectExportDeclarations:
      minItems: 1
      type: array
      description: Details of the indirect export declarations within this goods load.  Only
        valid for NI to GB movements where the goods originated from outside UK.
      items:
        required:
        - eadMasterRefNum
        type: object
        properties:
          eadMasterRefNum:
            pattern: "^\\d{2}(?!GB|XI)[A-Z]{2}[A-Z0-9]{14}$"
            type: string
            description: The master or movement reference number (MRN) of the Export
              Accompanying Document (EAD) for this indirect export.
            example: 19IE294000AFGRIG29
        additionalProperties: false
    isOwnVehicle:
      type: boolean
      description: Set to false if the haulier is moving the goods vehicle under a
        contract of carriage.  Set to true if there is no contract of carriage.
      example: false
    emptyVehicle:
      required:
      - isOwnVehicle
      type: object
      properties:
        isOwnVehicle:
          type: boolean
          description: Set to false if the haulier is moving the goods vehicle under
            a contract of carriage.  Set to true if there is no contract of carriage.
          example: false
        sAndSMasterRefNum:
          pattern: "^[A-Z0-9-)(/]{1,200}$"
          type: string
          description: "The master reference number (MRN) for a Safety & Security\
            \ declaration, where applicable."
          example: GB12323020392
      additionalProperties: false
      description: Declares that this is an empty movement and contains details about
        the empty movement.  Must be provided prior to check-in for empty movements.
    dbcGoods:
      minItems: 1
      type: array
      description: References for a Declaration by Conduct goods load.
      items:
        required:
        - sAndSMasterRefNum
        type: object
        properties:
          sAndSMasterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: "The master reference number or Movement Reference Number\
              \ (MRN) for a Safety & Security declaration, where applicable. This\
              \ may be required when the S&S declaration covers a DBC that is moving\
              \ under a contract of carriage. This applies to both ENS and EXS declarations."
            example:
            - GB12323020392
        additionalProperties: false
    dbcDeclaration:
      required:
      - isOwnVehicle
      type: object
      properties:
        isOwnVehicle:
          type: boolean
          description: Set to false if the haulier is moving the goods vehicle under
            a contract of carriage.  Set to true if there is no contract of carriage.
          example: false
        dbcGoods:
          minItems: 1
          type: array
          description: References for a Declaration by Conduct goods load.
          items:
            required:
            - sAndSMasterRefNum
            type: object
            properties:
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ may be required when the S&S declaration covers a DBC that is\
                  \ moving under a contract of carriage. This applies to both ENS\
                  \ and EXS declarations."
                example:
                - GB12323020392
            additionalProperties: false
      additionalProperties: false
      description: Declares goods moving under Declaration by Conduct.  Refer to the
        Oral and By Conduct List published at gov.uk for details.
    exemptedGoods:
      minItems: 1
      type: array
      description: The list of goods loads exempted from customs.  Used for GB>NI
        RMG <£900 B2B or GB>EU FPO+MOU goods loads.
      items:
        required:
        - sAndSMasterRefNum
        type: object
        properties:
          sAndSMasterRefNum:
            pattern: "^[A-Z0-9-)(/]{1,200}$"
            type: string
            description: The MRN or DUCR (depending on direction) for an ENS or EXS
              Safety & Security declaration for this goods load. ENS will accept both
              the format of ICS2 and ICSNI MRNs in GB_TO_NI direction.
            example:
            - GB12323020392
        additionalProperties: false
    exemptionDeclaration:
      type: object
      properties:
        exemptedGoods:
          minItems: 1
          type: array
          description: The list of goods loads exempted from customs.  Used for GB>NI
            RMG <£900 B2B or GB>EU FPO+MOU goods loads.
          items:
            required:
            - sAndSMasterRefNum
            type: object
            properties:
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: The MRN or DUCR (depending on direction) for an ENS or
                  EXS Safety & Security declaration for this goods load. ENS will
                  accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI direction.
                example:
                - GB12323020392
            additionalProperties: false
      additionalProperties: false
      description: Declares Royal Mail Group or ETOE goods in the movement that do
        not require a customs declaration.
    ukcDeclaration:
      required:
      - fpoEORI
      type: object
      properties:
        fpoEORI:
          pattern: "^[A-Z]{2}[0-9]{12,15}$"
          type: string
          description: GB or XI EORI for UK-C
      additionalProperties: false
      description: Details of UK-C declaration.
    post-gmr-schema_definitions:
      title: goodsMovementRecord
      required:
      - direction
      type: object
      not:
        anyOf:
        - required:
          - customsDeclarations
          - emptyVehicle
        - required:
          - emptyVehicle
          - transitDeclarations
        - required:
          - emptyVehicle
          - mtpDeclaration
        - required:
          - emptyVehicle
          - tirDeclarations
        - required:
          - ataDeclarations
          - emptyVehicle
        - required:
          - eidrDeclarations
          - emptyVehicle
        - required:
          - emptyVehicle
          - ukimsEidrDeclarations
        - required:
          - emptyVehicle
          - indirectExportDeclarations
        - required:
          - dbcDeclaration
          - emptyVehicle
        - required:
          - emptyVehicle
          - exemptionDeclaration
        - required:
          - emptyVehicle
          - ukcDeclaration
      properties:
        direction:
          type: string
          description: "The direction of the movement - into or out of the UK, or\
            \ between Great Britain and Northern Ireland"
          oneOf:
          - title: UK_INBOUND
            type: string
            description: The movement is travelling into the UK
            enum:
            - UK_INBOUND
          - title: UK_OUTBOUND
            type: string
            description: The movement is travelling out of the UK
            enum:
            - UK_OUTBOUND
          - title: GB_TO_NI
            type: string
            description: The movement is travelling out of Great Britain into Northern
              Ireland
            enum:
            - GB_TO_NI
          - title: NI_TO_GB
            type: string
            description: The movement is travelling out of Northern Ireland into Great
              Britain
            enum:
            - NI_TO_GB
        haulierType:
          type: string
          description: The type of haulier moving the goods
          example: STANDARD
          oneOf:
          - title: STANDARD
            type: string
            description: All hauliers that are not one of the other types
            enum:
            - STANDARD
          - title: FPO_ASN
            type: string
            description: Fast parcel operators that are members of the Anti-Smuggling
              Network
            enum:
            - FPO_ASN
          - title: FPO_OTHER
            type: string
            description: Fast parcel operators that are not members of the ASN and
              are not moving goods with a Memorandum of Understanding
            enum:
            - FPO_OTHER
          - title: NATO_MOD
            type: string
            description: NATO or MoD
            enum:
            - NATO_MOD
          - title: RMG
            type: string
            description: Royal Mail Group
            enum:
            - RMG
          - title: ETOE
            type: string
            description: Extra-Territorial Office of Exchange
            enum:
            - ETOE
        isUnaccompanied:
          type: boolean
          description: "Set to true if the vehicle will not be accompanying the trailer(s)\
            \ during the crossing, or if the vehicle is carrying a container that\
            \ will be detached and loaded for the crossing."
          example: false
        vehicleRegNum:
          pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,30})?$"
          type: string
          description: Vehicle registration number of the vehicle that will arrive
            at port.  If isUnaccompanied is set to false then vehicleRegNum must be
            provided to check-in.
          example: AB19 DEF
        trailerRegistrationNums:
          maxItems: 2
          minItems: 1
          uniqueItems: true
          type: array
          description: "For vehicles carrying trailers, the trailer registration number\
            \ of each trailer.  If isUnaccompanied is set to true then trailerRegistrationNums\
            \ or containerReferenceNums must be provided before check-in."
          items:
            pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
            type: string
            example: A1234567
        containerReferenceNums:
          minItems: 1
          uniqueItems: true
          type: array
          description: "For vehicles arriving with containers that will be detached\
            \ and loaded, the container reference number of each container in the\
            \ movement. If isUnaccompanied is set to true then trailerRegistrationNums\
            \ or containerReferenceNums must be provided before check-in."
          items:
            pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
            type: string
            example: CSQU3054383
        plannedCrossing:
          required:
          - routeId
          type: object
          properties:
            routeId:
              pattern: "^[A-Z0-9-]{1,200}$"
              type: string
              description: "The ID of the crossing route, using a routeId from the\
                \ GVMS reference data"
              example: "18273"
              default: ""
            localDateTimeOfDeparture:
              pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
              type: string
              description: "The planned date and time of departure, in local time\
                \ of the departure port. Must not include seconds, time zone or UTC\
                \ marker"
              example: 2021-08-11T10:58
          additionalProperties: false
          description: Details of the planned crossing.
        sAndSMasterRefNums:
          maxItems: 2500
          minItems: 1
          uniqueItems: true
          type: array
          description: The master reference numbers or Movement Reference Numbers
            (MRNs) for Safety & Security declarations - should be supplied where applicable.
          items:
            required:
            - masterRefNum
            type: object
            properties:
              masterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number (MRN) for a Safety & Security\
                  \ declaration, where applicable."
                example: GB12323020392
        customsDeclarations:
          minItems: 1
          type: array
          description: Details of the customs declarations within this goods load.
          items:
            required:
            - customsDeclarationId
            type: object
            properties:
              customsDeclarationId:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: |-
                  This is the identifier for a customs declaration from Customs Declaration Service (CDS).

                  For inbound movements declared in CDS it is a MRN, for example 19GB4S24GC3PPFGVR7.

                  For outbound movements declared in CDS it is a DUCR, for example 0GB689223596000-SE119404.
                example: 19GB4S24GC3PPFGVR7
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual consignments\
                  \ within a trailer. This applies to both ENS and EXS declarations.\
                  \ If there is one, include the S&S MRN for the customs declaration\
                  \ above here. ENS will accept both the format of ICS2 and ICSNI\
                  \ MRNs in GB_TO_NI direction"
                example:
                - GB12323020392
            additionalProperties: false
        mtpDeclaration:
          type: object
          properties:
            mtpGoods:
              minItems: 1
              type: array
              description: References for goods loads moving under a stamped paper
                MTP.
              items:
                required:
                - sAndSMasterRefNum
                type: object
                properties:
                  sAndSMasterRefNum:
                    pattern: "^[A-Z0-9-)(/]{1,200}$"
                    type: string
                    description: "The master reference number or Movement Reference\
                      \ Number (MRN) for a Safety & Security declaration, where applicable.\
                      \ This must be supplied when the S&S declaration covers individual\
                      \ Transit consignments within a trailer. This applies to both\
                      \ ENS and EXS declarations. If there is one, include the S&S\
                      \ MRN for the MTP declaration above here. ENS will accept both\
                      \ the format of ICS2 and ICSNI MRNs in GB_TO_NI direction."
                    example:
                    - GB12323020392
                additionalProperties: false
          additionalProperties: false
          description: "Details of a stamped, paper-based declaration using a Manual\
            \ Transit Procedure (MTP).  Only intended for use when technical issues\
            \ prevent use of Transit IT systems."
        transitDeclarations:
          minItems: 1
          type: array
          description: Details of the transit declarations within this goods load.
          items:
            required:
            - isTSAD
            - transitDeclarationId
            type: object
            properties:
              transitDeclarationId:
                pattern: "^\\d{2}[A-Z]{2}[A-Z0-9]{14}$"
                type: string
                description: This is the Transit MRN issued by the Office of Departure.  Must
                  be provided.
                example: 18AT320000TVWJYM68
              isTSAD:
                type: boolean
                description: "Set to true if the transit declaration is a TSAD, otherwise\
                  \ set to false (for a TAD)"
                example: false
              sAndSMasterRefNum:
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual Transit\
                  \ consignments within a trailer. This applies to both ENS and EXS\
                  \ declarations. If there is one, include the S&S MRN for the Transit\
                  \ declaration above here. ENS will accept both the format of ICS2\
                  \ and ICSNI MRNs in GB_TO_NI direction."
                oneOf:
                - pattern: "^[A-Z0-9-)(/]{1,200}$"
                  type: string
                  description: "The master reference number (MRN) for a Safety & Security\
                    \ declaration, where applicable."
                  example: GB12323020392
            additionalProperties: false
        tirDeclarations:
          minItems: 1
          type: array
          description: Details of one or more TIR Carnet declarations.  Must be provided
            prior to check-in for TIR movements.
          items:
            required:
            - tirCarnetId
            type: object
            properties:
              tirCarnetId:
                pattern: "^.{1,200}$"
                type: string
                description: The TIR Carnet ID for the carnet within a TIR goods movement
                example: ABC/123
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers TIR Carnet consignments\
                  \ within a trailer. This applies to both ENS and EXS declarations.\
                  \ If there is one, include the S&S MRN for the TIR declaration above\
                  \ here. ENS will accept both the format of ICS2 and ICSNI MRNs in\
                  \ GB_TO_NI direction."
                example:
                - GB12323020392
            additionalProperties: false
        ataDeclarations:
          minItems: 1
          type: array
          description: Details of one or more ATA Carnet declarations.  Must be provided
            prior to check-in for ATA movements.
          items:
            required:
            - ataCarnetId
            type: object
            properties:
              ataCarnetId:
                pattern: "^.{1,200}$"
                type: string
                description: The ATA Carnet ID for the carnet within an ATA goods
                  movement
                example: ABC/123
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers ATA Carnet consignments\
                  \ within a trailer. This applies to both ENS and EXS declarations.\
                  \ If there is one, include the S&S MRN for the ATA declaration above\
                  \ here. ENS will accept both the format of ICS2 and ICSNI MRNs in\
                  \ GB_TO_NI direction."
                example:
                - GB12323020392
            additionalProperties: false
        eidrDeclarations:
          minItems: 1
          type: array
          description: "Details of one or more EIDR declarations.  Must be provided\
            \ prior to check-in for EIDR movements.  For movements using a specially-issued\
            \ EORI, the same EORI may be entered multiple times, one entry for each\
            \ ENS S&S MRN travelling under EIDR."
          items:
            required:
            - traderEORI
            type: object
            properties:
              traderEORI:
                pattern: "^(?:(?:GB|XI)[0-9]{12,15}|(?!GB|XI)[A-Z]{2}[0-9A-Z]{1,15})$"
                type: string
                description: "The trader's EORI, GB EORIs are valid for all direction\
                  \ movements, XI and EU EORIs are valid for only GB to NI movements."
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual EIDR\
                  \ consignments within a trailer. This applies to both ENS and EXS\
                  \ declarations. If there is one, include the S&S MRN for the EIDR\
                  \ declaration above here. ENS will accept both the format of ICS2\
                  \ and ICSNI MRNs in GB_TO_NI direction."
                example:
                - GB12323020392
              localReferenceNumber:
                pattern: "^[A-Z0-9]{1,22}$"
                type: string
                description: It is only used for EIDR and UKIMS EIDR declarations
                  in the GB_TO_NI direction
              procedureCode:
                pattern: "^[0-9]{4}$"
                type: string
                description: It is only used for EIDR declarations in the GB_TO_NI
                  direction
            additionalProperties: false
        ukimsEidrDeclarations:
          minItems: 1
          type: array
          description: Details of one or more UKIMS EIDR declarations.
          items:
            required:
            - traderEORI
            type: object
            properties:
              traderEORI:
                pattern: "^[A-Z]{2}[0-9]{12,15}$"
                type: string
                description: "The trader's EORI, only XI EORIs are valid."
              nopWaiver:
                type: boolean
              localReferenceNumber:
                pattern: "^[A-Z0-9]{1,22}$"
                type: string
                description: It is only used for EIDR and UKIMS EIDR declarations
                  in the GB_TO_NI direction
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual UKIMS\
                  \ EIDR consignments within a trailer. This applies to both ENS and\
                  \ EXS declarations. If there is one, include the S&S MRN for the\
                  \ UKIMS EIDR declaration above here."
                example:
                - GB12323020392
            additionalProperties: false
        indirectExportDeclarations:
          minItems: 1
          type: array
          description: Details of the indirect export declarations within this goods
            load.  Only valid for NI to GB movements where the goods originated from
            outside UK.
          items:
            required:
            - eadMasterRefNum
            type: object
            properties:
              eadMasterRefNum:
                pattern: "^\\d{2}(?!GB|XI)[A-Z]{2}[A-Z0-9]{14}$"
                type: string
                description: The master or movement reference number (MRN) of the
                  Export Accompanying Document (EAD) for this indirect export.
                example: 19IE294000AFGRIG29
            additionalProperties: false
        emptyVehicle:
          required:
          - isOwnVehicle
          type: object
          properties:
            isOwnVehicle:
              type: boolean
              description: Set to false if the haulier is moving the goods vehicle
                under a contract of carriage.  Set to true if there is no contract
                of carriage.
              example: false
            sAndSMasterRefNum:
              pattern: "^[A-Z0-9-)(/]{1,200}$"
              type: string
              description: "The master reference number (MRN) for a Safety & Security\
                \ declaration, where applicable."
              example: GB12323020392
          additionalProperties: false
          description: Declares that this is an empty movement and contains details
            about the empty movement.  Must be provided prior to check-in for empty
            movements.
        dbcDeclaration:
          required:
          - isOwnVehicle
          type: object
          properties:
            isOwnVehicle:
              type: boolean
              description: Set to false if the haulier is moving the goods vehicle
                under a contract of carriage.  Set to true if there is no contract
                of carriage.
              example: false
            dbcGoods:
              minItems: 1
              type: array
              description: References for a Declaration by Conduct goods load.
              items:
                required:
                - sAndSMasterRefNum
                type: object
                properties:
                  sAndSMasterRefNum:
                    pattern: "^[A-Z0-9-)(/]{1,200}$"
                    type: string
                    description: "The master reference number or Movement Reference\
                      \ Number (MRN) for a Safety & Security declaration, where applicable.\
                      \ This may be required when the S&S declaration covers a DBC\
                      \ that is moving under a contract of carriage. This applies\
                      \ to both ENS and EXS declarations."
                    example:
                    - GB12323020392
                additionalProperties: false
          additionalProperties: false
          description: Declares goods moving under Declaration by Conduct.  Refer
            to the Oral and By Conduct List published at gov.uk for details.
        exemptionDeclaration:
          type: object
          properties:
            exemptedGoods:
              minItems: 1
              type: array
              description: The list of goods loads exempted from customs.  Used for
                GB>NI RMG <£900 B2B or GB>EU FPO+MOU goods loads.
              items:
                required:
                - sAndSMasterRefNum
                type: object
                properties:
                  sAndSMasterRefNum:
                    pattern: "^[A-Z0-9-)(/]{1,200}$"
                    type: string
                    description: The MRN or DUCR (depending on direction) for an ENS
                      or EXS Safety & Security declaration for this goods load. ENS
                      will accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI
                      direction.
                    example:
                    - GB12323020392
                additionalProperties: false
          additionalProperties: false
          description: Declares Royal Mail Group or ETOE goods in the movement that
            do not require a customs declaration.
        ukcDeclaration:
          required:
          - fpoEORI
          type: object
          properties:
            fpoEORI:
              pattern: "^[A-Z]{2}[0-9]{12,15}$"
              type: string
              description: GB or XI EORI for UK-C
          additionalProperties: false
          description: Details of UK-C declaration.
      additionalProperties: false
    haulierEORI:
      pattern: "^GB[0-9]{12,15}$"
      type: string
      description: The EORI of the haulier that is responsible for the vehicle making
        the goods movement
      example: GB123456789012
    gmrStatusVersion:
      type: integer
      description: The version number of the latest status notification for this GMR.  Each
        new notification for a given GMR will have a greater gmrStatusVersion than
        the last.
    ruleFailures:
      type: array
      description: "If the GMR is not finalisable, the reasons why are listed here.\
        \  These must be rectified in subsequent calls to the PUT API prior to check-in."
      items:
        title: The Items Schema
        required:
        - code
        - technicalMessage
        type: object
        properties:
          code:
            type: string
            description: A code indicating the ID of the rule that failed
            example: "007"
          technicalMessage:
            type: string
            description: A message describing the rule that failed
            example: Safety and Security MRN not found
          field:
            type: string
            description: A JSONPath pointing to the field that this rule failure concerns.
              Only included if the rule concerns a specific field e.g. a specific
              MRN.
            example: "$.customsDeclarations[2].sAndSMasterRefNum"
          value:
            type: string
            description: The value of the JSON field that this rule failure concerns.
              Only included if the rule concerns a specific field e.g. a specific
              MRN.
            example: GB1343113534
    metadata:
      required:
      - createdDateTime
      - gmrStatusVersion
      - state
      - updatedDateTime
      type: object
      properties:
        state:
          type: string
          description: The state of the GMR
          example: NOT_FINALISABLE
          oneOf:
          - title: NOT_FINALISABLE
            type: string
            description: The GMR is in a non-finalisable state.  This means an update
              will be required from the haulier prior to check-in.
            enum:
            - NOT_FINALISABLE
          - title: OPEN
            type: string
            description: The GMR is open for updates and is ready for check-in.
            enum:
            - OPEN
          - title: CHECKED_IN
            type: string
            description: "The GMR is checked-in, awaiting embarkation confirmation\
              \ from the carrier."
            enum:
            - CHECKED_IN
          - title: EMBARKED
            type: string
            description: "The GMR is embarked, meaning the goods movement has embarked\
              \ on its crossing but the goods are awaiting clearance to proceed."
            enum:
            - EMBARKED
          - title: COMPLETED
            type: string
            description: "The GMR is completed, meaning the goods movement has embarked\
              \ on its crossing and the goods are clear to proceed."
            enum:
            - COMPLETED
        gmrStatusVersion:
          type: integer
          description: The version number of the latest status notification for this
            GMR.  Each new notification for a given GMR will have a greater gmrStatusVersion
            than the last.
        inspectionRequired:
          type: boolean
          description: "If set to true, indicates that the vehicle requires a customs\
            \ inspection.  If set to false, indicates that the vehicle does not require\
            \ a customs inspection.  If not set, indicates the customs inspection\
            \ decision has not yet been made or is not applicable.  For outbound GMRs,\
            \ this indicates that the vehicle must present at an inspection facility\
            \ prior to checking-in at the port.  For Office of Transit inspections\
            \ for inbound GMRs, a decision may be made to inspect subsequent to a\
            \ notification that inspection is not required.  In this event a notification\
            \ will be sent that changes inspectionRequired from false to true.  If\
            \ this happens after leaving the port of arrival, the inspection should\
            \ be carried out at the next transit office e.g. the office of destination."
        reportToLocations:
          minItems: 1
          type: array
          description: "A list of one or more inspection types, from GVMS Reference\
            \ Data, that the vehicle must have carried out, in the order specified.\
            \  This means that where there are multiple entries here, the vehicle\
            \ must report for the first inspection type listed before each subsequent\
            \ listed inspection.  Each entry includes a list of available locations\
            \ for the inspection type."
          items:
            required:
            - inspectionTypeId
            - locationIds
            type: object
            properties:
              inspectionTypeId:
                pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                type: string
                description: An inspectionTypeId from GVMS Reference Data denoting
                  the type of inspection that needs to be performed on the vehicle.
                example: "7"
              locationIds:
                type: array
                description: A list of locationIds from GVMS Reference Data that are
                  available to perform this type of inspection.
                example: L0029A
                items:
                  pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                  type: string
            description: Information about an inspection that is required
            example:
              inspectionTypeId: "1"
              locationIds:
              - L0029A
              - L0030A
        createdDateTime:
          pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\d.\\d{3}Z$"
          type: string
          description: The date and time that this GMR was created.
          example: 2021-08-11T10:58:12
        updatedDateTime:
          pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\d.\\d{3}Z$"
          type: string
          description: The date and time that this GMR was last updated.
          example: 2021-08-12T15:34:02
        ruleFailures:
          type: array
          description: "If the GMR is not finalisable, the reasons why are listed\
            \ here.  These must be rectified in subsequent calls to the PUT API prior\
            \ to check-in."
          items:
            title: The Items Schema
            required:
            - code
            - technicalMessage
            type: object
            properties:
              code:
                type: string
                description: A code indicating the ID of the rule that failed
                example: "007"
              technicalMessage:
                type: string
                description: A message describing the rule that failed
                example: Safety and Security MRN not found
              field:
                type: string
                description: A JSONPath pointing to the field that this rule failure
                  concerns. Only included if the rule concerns a specific field e.g.
                  a specific MRN.
                example: "$.customsDeclarations[2].sAndSMasterRefNum"
              value:
                type: string
                description: The value of the JSON field that this rule failure concerns.
                  Only included if the rule concerns a specific field e.g. a specific
                  MRN.
                example: GB1343113534
      description: Information from the Goods Vehicle Movement Service about this
        GMR.
    get-gmr-schema_definitions:
      title: get-gmr
      required:
      - direction
      - gmrId
      - haulierEORI
      - metadata
      type: object
      not:
        anyOf:
        - required:
          - customsDeclarations
          - emptyVehicle
        - required:
          - emptyVehicle
          - transitDeclarations
        - required:
          - emptyVehicle
          - mtpDeclaration
        - required:
          - emptyVehicle
          - tirDeclarations
        - required:
          - ataDeclarations
          - emptyVehicle
        - required:
          - eidrDeclarations
          - emptyVehicle
        - required:
          - emptyVehicle
          - ukimsEidrDeclarations
        - required:
          - emptyVehicle
          - indirectExportDeclarations
        - required:
          - dbcDeclaration
          - emptyVehicle
        - required:
          - emptyVehicle
          - exemptionDeclaration
        - required:
          - emptyVehicle
          - ukcDeclaration
      properties:
        gmrId:
          pattern: "^GMR[A-Z][0-9A-Z]{8}$"
          type: string
          description: The Goods Movement Record (GMR) ID for this GMR.  Do not include
            when POSTing a GMR - GVMS will assign an ID.
          example: GMRA000002JR
        haulierEORI:
          pattern: "^GB[0-9]{12,15}$"
          type: string
          description: The EORI of the haulier that is responsible for the vehicle
            making the goods movement
          example: GB123456789012
        metadata:
          required:
          - createdDateTime
          - gmrStatusVersion
          - state
          - updatedDateTime
          type: object
          properties:
            state:
              type: string
              description: The state of the GMR
              example: NOT_FINALISABLE
              oneOf:
              - title: NOT_FINALISABLE
                type: string
                description: The GMR is in a non-finalisable state.  This means an
                  update will be required from the haulier prior to check-in.
                enum:
                - NOT_FINALISABLE
              - title: OPEN
                type: string
                description: The GMR is open for updates and is ready for check-in.
                enum:
                - OPEN
              - title: CHECKED_IN
                type: string
                description: "The GMR is checked-in, awaiting embarkation confirmation\
                  \ from the carrier."
                enum:
                - CHECKED_IN
              - title: EMBARKED
                type: string
                description: "The GMR is embarked, meaning the goods movement has\
                  \ embarked on its crossing but the goods are awaiting clearance\
                  \ to proceed."
                enum:
                - EMBARKED
              - title: COMPLETED
                type: string
                description: "The GMR is completed, meaning the goods movement has\
                  \ embarked on its crossing and the goods are clear to proceed."
                enum:
                - COMPLETED
            gmrStatusVersion:
              type: integer
              description: The version number of the latest status notification for
                this GMR.  Each new notification for a given GMR will have a greater
                gmrStatusVersion than the last.
            inspectionRequired:
              type: boolean
              description: "If set to true, indicates that the vehicle requires a\
                \ customs inspection.  If set to false, indicates that the vehicle\
                \ does not require a customs inspection.  If not set, indicates the\
                \ customs inspection decision has not yet been made or is not applicable.\
                \  For outbound GMRs, this indicates that the vehicle must present\
                \ at an inspection facility prior to checking-in at the port.  For\
                \ Office of Transit inspections for inbound GMRs, a decision may be\
                \ made to inspect subsequent to a notification that inspection is\
                \ not required.  In this event a notification will be sent that changes\
                \ inspectionRequired from false to true.  If this happens after leaving\
                \ the port of arrival, the inspection should be carried out at the\
                \ next transit office e.g. the office of destination."
            reportToLocations:
              minItems: 1
              type: array
              description: "A list of one or more inspection types, from GVMS Reference\
                \ Data, that the vehicle must have carried out, in the order specified.\
                \  This means that where there are multiple entries here, the vehicle\
                \ must report for the first inspection type listed before each subsequent\
                \ listed inspection.  Each entry includes a list of available locations\
                \ for the inspection type."
              items:
                required:
                - inspectionTypeId
                - locationIds
                type: object
                properties:
                  inspectionTypeId:
                    pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                    type: string
                    description: An inspectionTypeId from GVMS Reference Data denoting
                      the type of inspection that needs to be performed on the vehicle.
                    example: "7"
                  locationIds:
                    type: array
                    description: A list of locationIds from GVMS Reference Data that
                      are available to perform this type of inspection.
                    example: L0029A
                    items:
                      pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                      type: string
                description: Information about an inspection that is required
                example:
                  inspectionTypeId: "1"
                  locationIds:
                  - L0029A
                  - L0030A
            createdDateTime:
              pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\d.\\d{3}Z$"
              type: string
              description: The date and time that this GMR was created.
              example: 2021-08-11T10:58:12
            updatedDateTime:
              pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\d.\\d{3}Z$"
              type: string
              description: The date and time that this GMR was last updated.
              example: 2021-08-12T15:34:02
            ruleFailures:
              type: array
              description: "If the GMR is not finalisable, the reasons why are listed\
                \ here.  These must be rectified in subsequent calls to the PUT API\
                \ prior to check-in."
              items:
                title: The Items Schema
                required:
                - code
                - technicalMessage
                type: object
                properties:
                  code:
                    type: string
                    description: A code indicating the ID of the rule that failed
                    example: "007"
                  technicalMessage:
                    type: string
                    description: A message describing the rule that failed
                    example: Safety and Security MRN not found
                  field:
                    type: string
                    description: A JSONPath pointing to the field that this rule failure
                      concerns. Only included if the rule concerns a specific field
                      e.g. a specific MRN.
                    example: "$.customsDeclarations[2].sAndSMasterRefNum"
                  value:
                    type: string
                    description: The value of the JSON field that this rule failure
                      concerns. Only included if the rule concerns a specific field
                      e.g. a specific MRN.
                    example: GB1343113534
          description: Information from the Goods Vehicle Movement Service about this
            GMR.
        direction:
          type: string
          description: "The direction of the movement - into or out of the UK, or\
            \ between Great Britain and Northern Ireland"
          oneOf:
          - title: UK_INBOUND
            type: string
            description: The movement is travelling into the UK
            enum:
            - UK_INBOUND
          - title: UK_OUTBOUND
            type: string
            description: The movement is travelling out of the UK
            enum:
            - UK_OUTBOUND
          - title: GB_TO_NI
            type: string
            description: The movement is travelling out of Great Britain into Northern
              Ireland
            enum:
            - GB_TO_NI
          - title: NI_TO_GB
            type: string
            description: The movement is travelling out of Northern Ireland into Great
              Britain
            enum:
            - NI_TO_GB
        haulierType:
          type: string
          description: The type of haulier moving the goods
          example: STANDARD
          oneOf:
          - title: STANDARD
            type: string
            description: All hauliers that are not one of the other types
            enum:
            - STANDARD
          - title: FPO_ASN
            type: string
            description: Fast parcel operators that are members of the Anti-Smuggling
              Network
            enum:
            - FPO_ASN
          - title: FPO_OTHER
            type: string
            description: Fast parcel operators that are not members of the ASN and
              are not moving goods with a Memorandum of Understanding
            enum:
            - FPO_OTHER
          - title: NATO_MOD
            type: string
            description: NATO or MoD
            enum:
            - NATO_MOD
          - title: RMG
            type: string
            description: Royal Mail Group
            enum:
            - RMG
          - title: ETOE
            type: string
            description: Extra-Territorial Office of Exchange
            enum:
            - ETOE
        isUnaccompanied:
          type: boolean
          description: "Set to true if the vehicle will not be accompanying the trailer(s)\
            \ during the crossing, or if the vehicle is carrying a container that\
            \ will be detached and loaded for the crossing."
          example: false
        vehicleRegNum:
          pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,30})?$"
          type: string
          description: Vehicle registration number of the vehicle that will arrive
            at port.  If isUnaccompanied is set to false then vehicleRegNum must be
            provided to check-in.
          example: AB19 DEF
        trailerRegistrationNums:
          maxItems: 2
          minItems: 1
          uniqueItems: true
          type: array
          description: "For vehicles carrying trailers, the trailer registration number\
            \ of each trailer.  If isUnaccompanied is set to true then trailerRegistrationNums\
            \ or containerReferenceNums must be provided before check-in."
          items:
            pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
            type: string
            example: A1234567
        containerReferenceNums:
          minItems: 1
          uniqueItems: true
          type: array
          description: "For vehicles arriving with containers that will be detached\
            \ and loaded, the container reference number of each container in the\
            \ movement. If isUnaccompanied is set to true then trailerRegistrationNums\
            \ or containerReferenceNums must be provided before check-in."
          items:
            pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
            type: string
            example: CSQU3054383
        plannedCrossing:
          required:
          - routeId
          type: object
          properties:
            routeId:
              pattern: "^[A-Z0-9-]{1,200}$"
              type: string
              description: "The ID of the crossing route, using a routeId from the\
                \ GVMS reference data"
              example: "18273"
              default: ""
            localDateTimeOfDeparture:
              pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
              type: string
              description: "The planned date and time of departure, in local time\
                \ of the departure port. Must not include seconds, time zone or UTC\
                \ marker"
              example: 2021-08-11T10:58
          additionalProperties: false
          description: Details of the planned crossing.
        checkedInCrossing:
          required:
          - localDateTimeOfArrival
          - routeId
          type: object
          properties:
            routeId:
              pattern: "^[A-Z0-9-]{1,200}$"
              type: string
              description: "The ID of the crossing route, using a routeId from the\
                \ GVMS reference data"
              example: "18273"
              default: ""
            localDateTimeOfArrival:
              pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
              type: string
              description: "The planned date and time of arrival, in local time of\
                \ the arrival port. Must not include seconds, time zone or UTC marker"
              example: 2021-08-11T10:58
          additionalProperties: false
          description: Details of the crossing that the vehicle has been checked-in
            to. These details will only be present in the Goods Movement Record after
            the vehicle has checked in.
        actualCrossing:
          required:
          - localDateTimeOfArrival
          - routeId
          type: object
          properties:
            routeId:
              pattern: "^[A-Z0-9-]{1,200}$"
              type: string
              description: "The ID of the crossing route, using a routeId from the\
                \ GVMS reference data"
              example: "18273"
              default: ""
            localDateTimeOfArrival:
              pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
              type: string
              description: "The planned date and time of arrival, in local time of\
                \ the arrival port. Must not include seconds, time zone or UTC marker"
              example: 2021-08-11T10:58
          additionalProperties: false
          description: Details of the crossing that the goods movement has been embarked
            on. These details will only be present in the Goods Movement Record after
            the vehicle has embarked on a crossing.
        sAndSMasterRefNums:
          maxItems: 2500
          minItems: 1
          uniqueItems: true
          type: array
          description: The master reference numbers or Movement Reference Numbers
            (MRNs) for Safety & Security declarations - should be supplied where applicable.
          items:
            required:
            - masterRefNum
            type: object
            properties:
              masterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number (MRN) for a Safety & Security\
                  \ declaration, where applicable."
                example: GB12323020392
        customsDeclarations:
          minItems: 1
          type: array
          description: Details of the customs declarations within this goods load.
          items:
            required:
            - customsDeclarationId
            type: object
            properties:
              customsDeclarationId:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: |-
                  This is the identifier for a customs declaration from Customs Declaration Service (CDS).

                  For inbound movements declared in CDS it is a MRN, for example 19GB4S24GC3PPFGVR7.

                  For outbound movements declared in CDS it is a DUCR, for example 0GB689223596000-SE119404.
                example: 19GB4S24GC3PPFGVR7
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual consignments\
                  \ within a trailer. This applies to both ENS and EXS declarations.\
                  \ If there is one, include the S&S MRN for the customs declaration\
                  \ above here. ENS will accept both the format of ICS2 and ICSNI\
                  \ MRNs in GB_TO_NI direction"
                example:
                - GB12323020392
            additionalProperties: false
        mtpDeclaration:
          type: object
          properties:
            mtpGoods:
              minItems: 1
              type: array
              description: References for goods loads moving under a stamped paper
                MTP.
              items:
                required:
                - sAndSMasterRefNum
                type: object
                properties:
                  sAndSMasterRefNum:
                    pattern: "^[A-Z0-9-)(/]{1,200}$"
                    type: string
                    description: "The master reference number or Movement Reference\
                      \ Number (MRN) for a Safety & Security declaration, where applicable.\
                      \ This must be supplied when the S&S declaration covers individual\
                      \ Transit consignments within a trailer. This applies to both\
                      \ ENS and EXS declarations. If there is one, include the S&S\
                      \ MRN for the MTP declaration above here. ENS will accept both\
                      \ the format of ICS2 and ICSNI MRNs in GB_TO_NI direction."
                    example:
                    - GB12323020392
                additionalProperties: false
          additionalProperties: false
          description: "Details of a stamped, paper-based declaration using a Manual\
            \ Transit Procedure (MTP).  Only intended for use when technical issues\
            \ prevent use of Transit IT systems."
        transitDeclarations:
          minItems: 1
          type: array
          description: Details of the transit declarations within this goods load.
          items:
            required:
            - isTSAD
            - transitDeclarationId
            type: object
            properties:
              transitDeclarationId:
                pattern: "^\\d{2}[A-Z]{2}[A-Z0-9]{14}$"
                type: string
                description: This is the Transit MRN issued by the Office of Departure.  Must
                  be provided.
                example: 18AT320000TVWJYM68
              isTSAD:
                type: boolean
                description: "Set to true if the transit declaration is a TSAD, otherwise\
                  \ set to false (for a TAD)"
                example: false
              sAndSMasterRefNum:
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual Transit\
                  \ consignments within a trailer. This applies to both ENS and EXS\
                  \ declarations. If there is one, include the S&S MRN for the Transit\
                  \ declaration above here. ENS will accept both the format of ICS2\
                  \ and ICSNI MRNs in GB_TO_NI direction."
                oneOf:
                - pattern: "^[A-Z0-9-)(/]{1,200}$"
                  type: string
                  description: "The master reference number (MRN) for a Safety & Security\
                    \ declaration, where applicable."
                  example: GB12323020392
            additionalProperties: false
        tirDeclarations:
          minItems: 1
          type: array
          description: Details of one or more TIR Carnet declarations.  Must be provided
            prior to check-in for TIR movements.
          items:
            required:
            - tirCarnetId
            type: object
            properties:
              tirCarnetId:
                pattern: "^.{1,200}$"
                type: string
                description: The TIR Carnet ID for the carnet within a TIR goods movement
                example: ABC/123
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers TIR Carnet consignments\
                  \ within a trailer. This applies to both ENS and EXS declarations.\
                  \ If there is one, include the S&S MRN for the TIR declaration above\
                  \ here. ENS will accept both the format of ICS2 and ICSNI MRNs in\
                  \ GB_TO_NI direction."
                example:
                - GB12323020392
            additionalProperties: false
        ataDeclarations:
          minItems: 1
          type: array
          description: Details of one or more ATA Carnet declarations.  Must be provided
            prior to check-in for ATA movements.
          items:
            required:
            - ataCarnetId
            type: object
            properties:
              ataCarnetId:
                pattern: "^.{1,200}$"
                type: string
                description: The ATA Carnet ID for the carnet within an ATA goods
                  movement
                example: ABC/123
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers ATA Carnet consignments\
                  \ within a trailer. This applies to both ENS and EXS declarations.\
                  \ If there is one, include the S&S MRN for the ATA declaration above\
                  \ here. ENS will accept both the format of ICS2 and ICSNI MRNs in\
                  \ GB_TO_NI direction."
                example:
                - GB12323020392
            additionalProperties: false
        eidrDeclarations:
          minItems: 1
          type: array
          description: "Details of one or more EIDR declarations.  Must be provided\
            \ prior to check-in for EIDR movements.  For movements using a specially-issued\
            \ EORI, the same EORI may be entered multiple times, one entry for each\
            \ ENS S&S MRN travelling under EIDR."
          items:
            required:
            - traderEORI
            type: object
            properties:
              traderEORI:
                pattern: "^(?:(?:GB|XI)[0-9]{12,15}|(?!GB|XI)[A-Z]{2}[0-9A-Z]{1,15})$"
                type: string
                description: "The trader's EORI, GB EORIs are valid for all direction\
                  \ movements, XI and EU EORIs are valid for only GB to NI movements."
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual EIDR\
                  \ consignments within a trailer. This applies to both ENS and EXS\
                  \ declarations. If there is one, include the S&S MRN for the EIDR\
                  \ declaration above here. ENS will accept both the format of ICS2\
                  \ and ICSNI MRNs in GB_TO_NI direction."
                example:
                - GB12323020392
              localReferenceNumber:
                pattern: "^[A-Z0-9]{1,22}$"
                type: string
                description: It is only used for EIDR and UKIMS EIDR declarations
                  in the GB_TO_NI direction
              procedureCode:
                pattern: "^[0-9]{4}$"
                type: string
                description: It is only used for EIDR declarations in the GB_TO_NI
                  direction
            additionalProperties: false
        ukimsEidrDeclarations:
          minItems: 1
          type: array
          description: Details of one or more UKIMS EIDR declarations.
          items:
            required:
            - traderEORI
            type: object
            properties:
              traderEORI:
                pattern: "^[A-Z]{2}[0-9]{12,15}$"
                type: string
                description: "The trader's EORI, only XI EORIs are valid."
              nopWaiver:
                type: boolean
              localReferenceNumber:
                pattern: "^[A-Z0-9]{1,22}$"
                type: string
                description: It is only used for EIDR and UKIMS EIDR declarations
                  in the GB_TO_NI direction
              sAndSMasterRefNum:
                pattern: "^[A-Z0-9-)(/]{1,200}$"
                type: string
                description: "The master reference number or Movement Reference Number\
                  \ (MRN) for a Safety & Security declaration, where applicable. This\
                  \ must be supplied when the S&S declaration covers individual UKIMS\
                  \ EIDR consignments within a trailer. This applies to both ENS and\
                  \ EXS declarations. If there is one, include the S&S MRN for the\
                  \ UKIMS EIDR declaration above here."
                example:
                - GB12323020392
            additionalProperties: false
        indirectExportDeclarations:
          minItems: 1
          type: array
          description: Details of the indirect export declarations within this goods
            load.  Only valid for NI to GB movements where the goods originated from
            outside UK.
          items:
            required:
            - eadMasterRefNum
            type: object
            properties:
              eadMasterRefNum:
                pattern: "^\\d{2}(?!GB|XI)[A-Z]{2}[A-Z0-9]{14}$"
                type: string
                description: The master or movement reference number (MRN) of the
                  Export Accompanying Document (EAD) for this indirect export.
                example: 19IE294000AFGRIG29
            additionalProperties: false
        emptyVehicle:
          required:
          - isOwnVehicle
          type: object
          properties:
            isOwnVehicle:
              type: boolean
              description: Set to false if the haulier is moving the goods vehicle
                under a contract of carriage.  Set to true if there is no contract
                of carriage.
              example: false
            sAndSMasterRefNum:
              pattern: "^[A-Z0-9-)(/]{1,200}$"
              type: string
              description: "The master reference number (MRN) for a Safety & Security\
                \ declaration, where applicable."
              example: GB12323020392
          additionalProperties: false
          description: Declares that this is an empty movement and contains details
            about the empty movement.  Must be provided prior to check-in for empty
            movements.
        dbcDeclaration:
          required:
          - isOwnVehicle
          type: object
          properties:
            isOwnVehicle:
              type: boolean
              description: Set to false if the haulier is moving the goods vehicle
                under a contract of carriage.  Set to true if there is no contract
                of carriage.
              example: false
            dbcGoods:
              minItems: 1
              type: array
              description: References for a Declaration by Conduct goods load.
              items:
                required:
                - sAndSMasterRefNum
                type: object
                properties:
                  sAndSMasterRefNum:
                    pattern: "^[A-Z0-9-)(/]{1,200}$"
                    type: string
                    description: "The master reference number or Movement Reference\
                      \ Number (MRN) for a Safety & Security declaration, where applicable.\
                      \ This may be required when the S&S declaration covers a DBC\
                      \ that is moving under a contract of carriage. This applies\
                      \ to both ENS and EXS declarations."
                    example:
                    - GB12323020392
                additionalProperties: false
          additionalProperties: false
          description: Declares goods moving under Declaration by Conduct.  Refer
            to the Oral and By Conduct List published at gov.uk for details.
        exemptionDeclaration:
          type: object
          properties:
            exemptedGoods:
              minItems: 1
              type: array
              description: The list of goods loads exempted from customs.  Used for
                GB>NI RMG <£900 B2B or GB>EU FPO+MOU goods loads.
              items:
                required:
                - sAndSMasterRefNum
                type: object
                properties:
                  sAndSMasterRefNum:
                    pattern: "^[A-Z0-9-)(/]{1,200}$"
                    type: string
                    description: The MRN or DUCR (depending on direction) for an ENS
                      or EXS Safety & Security declaration for this goods load. ENS
                      will accept both the format of ICS2 and ICSNI MRNs in GB_TO_NI
                      direction.
                    example:
                    - GB12323020392
                additionalProperties: false
          additionalProperties: false
          description: Declares Royal Mail Group or ETOE goods in the movement that
            do not require a customs declaration.
        ukcDeclaration:
          required:
          - fpoEORI
          type: object
          properties:
            fpoEORI:
              pattern: "^[A-Z]{2}[0-9]{12,15}$"
              type: string
              description: GB or XI EORI for UK-C
          additionalProperties: false
          description: Details of UK-C declaration.
        links:
          type: array
          description: A list of endpoint links that indicate possible actions related
            to the current resource
          items:
            required:
            - href
            - method
            - rel
            type: object
            properties:
              href:
                type: string
                description: The relative URL of the endpoint
                example: /customs/goods-movement-system/movements/GMRB-0000-0A9C
              method:
                type: string
                description: The HTTP method type for the endpoint
                example: PUT
                oneOf:
                - title: PUT
                  type: string
                  enum:
                  - PUT
                - title: DELETE
                  type: string
                  enum:
                  - DELETE
              rel:
                type: string
                description: "A label for the endpoint, which describes how it is\
                  \ related to the current resource. The rel will be self where the\
                  \ action is retrieval of the same resource."
                example: update-goods-movement-record
                oneOf:
                - title: update-goods-movement-record
                  type: string
                  description: The rel for the PUT method
                  enum:
