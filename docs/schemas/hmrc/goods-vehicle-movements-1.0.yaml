        required: true
      responses:
        "202":
          description: |
            The goods movement record creation request has been accepted.  Use the Push Pull Notifications API to retrieve the GMR that will be created.
          headers:
            Notification-Message-Id:
              description: |
                The messageId that will be included in a notification message created in response to this request.  See above for more information about notifications.
              required: true
              style: simple
              explode: false
              schema:
                type: string
                example: 368ed1fc-a082-41cb-a8bd-ac04cc5bdc55
            Notification-Box-Id:
              description: |
                The boxId to use when retrieving the notification created in response to this request.  See above for more information about notifications.
              required: true
              style: simple
              explode: false
              schema:
                type: string
                example: 3af01911-75ed-4412-a12d-ca80f626ab10
        "400":
          description: ""
          content:
            application/json:
              schema:
                title: error-response
                required:
                - code
                type: object
                properties:
                  code:
                    type: string
              examples:
                INVALID_JSON_FORMAT:
                  description: |
                    The request body is not a valid JSON format.
                  value:
                    code: INVALID_JSON_FORMAT
                JSON_SCHEMA_ERROR:
                  description: |
                    The request body does not conform to the expected JSON schema.
                  value:
                    code: JSON_SCHEMA_ERROR
                NOT_YET_SUPPORTED:
                  description: |
                    The requested operation is not yet supported by the API.
                  value:
                    code: NOT_YET_SUPPORTED
                EORI_NOT_SUPPORTED:
                  description: |
                    The EORI provided is not supported by the API.
                  value:
                    code: EORI_NOT_SUPPORTED
                INVALID_ROUTE:
                  description: |
                    The routeId provided is not valid.
                  value:
                    code: INVALID_ROUTE
        "403":
          description: ""
          content:
            application/json:
              schema:
                title: error-response
                required:
                - code
                type: object
                properties:
                  code:
                    type: string
              examples:
                EORI_MISMATCH:
                  description: |
                    The caller's EORI does not match the goods movement record EORI
                  value:
                    code: EORI_MISMATCH
                FORBIDDEN:
                  description: |
                    You are not enrolled for this service
                  value:
                    code: FORBIDDEN
      security:
      - userRestricted:
        - write:goods-movement-system
  /customs/goods-movement-system/movements/{gmrId}:
    get:
      summary: Get Goods Movement Record
      description: |
        This endpoint gets a Goods Movement Record (GMR)

        The returned GMR will reflect the latest record received with the given GMR ID, and will include a metadata object detailing the GMR's current status and any errors or issues.
      operationId: Get Goods Movement Record
      parameters:
      - name: gmrId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: |
            The ID of a Goods Movement Record (GMR)
        example: GMRI00000A45
      - name: Accept
        in: header
        description: |
          Specifies the response format and the [version](/api-documentation/docs/reference-guide#versioning) of the API to be used.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: |
          An OAuth 2.0 Bearer Token.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: Bearer bb7fed3fe10dd235a2ccda3d50fb
      responses:
        "200":
          description: The Goods Movement Record was found and is provided in the
            response body
          content:
            application/json:
              schema:
                title: get-gmr
                required:
                - direction
                - gmrId
                - haulierEORI
                - metadata
                type: object
                not:
                  anyOf:
                  - required:
                    - customsDeclarations
                    - emptyVehicle
                  - required:
                    - emptyVehicle
                    - transitDeclarations
                  - required:
                    - emptyVehicle
                    - mtpDeclaration
                  - required:
                    - emptyVehicle
                    - tirDeclarations
                  - required:
                    - ataDeclarations
                    - emptyVehicle
                  - required:
                    - eidrDeclarations
                    - emptyVehicle
                  - required:
                    - emptyVehicle
                    - ukimsEidrDeclarations
                  - required:
                    - emptyVehicle
                    - indirectExportDeclarations
                  - required:
                    - dbcDeclaration
                    - emptyVehicle
                  - required:
                    - emptyVehicle
                    - exemptionDeclaration
                  - required:
                    - emptyVehicle
                    - ukcDeclaration
                properties:
                  gmrId:
                    pattern: "^GMR[A-Z][0-9A-Z]{8}$"
                    type: string
                    description: The Goods Movement Record (GMR) ID for this GMR.  Do
                      not include when POSTing a GMR - GVMS will assign an ID.
                    example: GMRA000002JR
                  haulierEORI:
                    pattern: "^GB[0-9]{12,15}$"
                    type: string
                    description: The EORI of the haulier that is responsible for the
                      vehicle making the goods movement
                    example: GB123456789012
                  metadata:
                    required:
                    - createdDateTime
                    - gmrStatusVersion
                    - state
                    - updatedDateTime
                    type: object
                    properties:
                      state:
                        type: string
                        description: The state of the GMR
                        example: NOT_FINALISABLE
                        oneOf:
                        - title: NOT_FINALISABLE
                          type: string
                          description: The GMR is in a non-finalisable state.  This
                            means an update will be required from the haulier prior
                            to check-in.
                          enum:
                          - NOT_FINALISABLE
                        - title: OPEN
                          type: string
                          description: The GMR is open for updates and is ready for
                            check-in.
                          enum:
                          - OPEN
                        - title: CHECKED_IN
                          type: string
                          description: "The GMR is checked-in, awaiting embarkation\
                            \ confirmation from the carrier."
                          enum:
                          - CHECKED_IN
                        - title: EMBARKED
                          type: string
                          description: "The GMR is embarked, meaning the goods movement\
                            \ has embarked on its crossing but the goods are awaiting\
                            \ clearance to proceed."
                          enum:
                          - EMBARKED
                        - title: COMPLETED
                          type: string
                          description: "The GMR is completed, meaning the goods movement\
                            \ has embarked on its crossing and the goods are clear\
                            \ to proceed."
                          enum:
                          - COMPLETED
                      gmrStatusVersion:
                        type: integer
                        description: The version number of the latest status notification
                          for this GMR.  Each new notification for a given GMR will
                          have a greater gmrStatusVersion than the last.
                      inspectionRequired:
                        type: boolean
                        description: "If set to true, indicates that the vehicle requires\
                          \ a customs inspection.  If set to false, indicates that\
                          \ the vehicle does not require a customs inspection.  If\
                          \ not set, indicates the customs inspection decision has\
                          \ not yet been made or is not applicable.  For outbound\
                          \ GMRs, this indicates that the vehicle must present at\
                          \ an inspection facility prior to checking-in at the port.\
                          \  For Office of Transit inspections for inbound GMRs, a\
                          \ decision may be made to inspect subsequent to a notification\
                          \ that inspection is not required.  In this event a notification\
                          \ will be sent that changes inspectionRequired from false\
                          \ to true.  If this happens after leaving the port of arrival,\
                          \ the inspection should be carried out at the next transit\
                          \ office e.g. the office of destination."
                      reportToLocations:
                        minItems: 1
                        type: array
                        description: "A list of one or more inspection types, from\
                          \ GVMS Reference Data, that the vehicle must have carried\
                          \ out, in the order specified.  This means that where there\
                          \ are multiple entries here, the vehicle must report for\
                          \ the first inspection type listed before each subsequent\
                          \ listed inspection.  Each entry includes a list of available\
                          \ locations for the inspection type."
                        items:
                          required:
                          - inspectionTypeId
                          - locationIds
                          type: object
                          properties:
                            inspectionTypeId:
                              pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                              type: string
                              description: An inspectionTypeId from GVMS Reference
                                Data denoting the type of inspection that needs to
                                be performed on the vehicle.
                              example: "7"
                            locationIds:
                              type: array
                              description: A list of locationIds from GVMS Reference
                                Data that are available to perform this type of inspection.
                              example: L0029A
                              items:
                                pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                                type: string
                          description: Information about an inspection that is required
                          example:
                            inspectionTypeId: "1"
                            locationIds:
                            - L0029A
                            - L0030A
                      createdDateTime:
                        pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\\
                          d.\\d{3}Z$"
                        type: string
                        description: The date and time that this GMR was created.
                        example: 2021-08-11T10:58:12
                      updatedDateTime:
                        pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\\
                          d.\\d{3}Z$"
                        type: string
                        description: The date and time that this GMR was last updated.
                        example: 2021-08-12T15:34:02
                      ruleFailures:
                        type: array
                        description: "If the GMR is not finalisable, the reasons why\
                          \ are listed here.  These must be rectified in subsequent\
                          \ calls to the PUT API prior to check-in."
                        items:
                          title: The Items Schema
                          required:
                          - code
                          - technicalMessage
                          type: object
                          properties:
                            code:
                              type: string
                              description: A code indicating the ID of the rule that
                                failed
                              example: "007"
                            technicalMessage:
                              type: string
                              description: A message describing the rule that failed
                              example: Safety and Security MRN not found
                            field:
                              type: string
                              description: A JSONPath pointing to the field that this
                                rule failure concerns. Only included if the rule concerns
                                a specific field e.g. a specific MRN.
                              example: "$.customsDeclarations[2].sAndSMasterRefNum"
                            value:
                              type: string
                              description: The value of the JSON field that this rule
                                failure concerns. Only included if the rule concerns
                                a specific field e.g. a specific MRN.
                              example: GB1343113534
                    description: Information from the Goods Vehicle Movement Service
                      about this GMR.
                  direction:
                    type: string
                    description: "The direction of the movement - into or out of the\
                      \ UK, or between Great Britain and Northern Ireland"
                    oneOf:
                    - title: UK_INBOUND
                      type: string
                      description: The movement is travelling into the UK
                      enum:
                      - UK_INBOUND
                    - title: UK_OUTBOUND
                      type: string
                      description: The movement is travelling out of the UK
                      enum:
                      - UK_OUTBOUND
                    - title: GB_TO_NI
                      type: string
                      description: The movement is travelling out of Great Britain
                        into Northern Ireland
                      enum:
                      - GB_TO_NI
                    - title: NI_TO_GB
                      type: string
                      description: The movement is travelling out of Northern Ireland
                        into Great Britain
                      enum:
                      - NI_TO_GB
                  haulierType:
                    type: string
                    description: The type of haulier moving the goods
                    example: STANDARD
                    oneOf:
                    - title: STANDARD
                      type: string
                      description: All hauliers that are not one of the other types
                      enum:
                      - STANDARD
                    - title: FPO_ASN
                      type: string
                      description: Fast parcel operators that are members of the Anti-Smuggling
                        Network
                      enum:
                      - FPO_ASN
                    - title: FPO_OTHER
                      type: string
                      description: Fast parcel operators that are not members of the
                        ASN and are not moving goods with a Memorandum of Understanding
                      enum:
                      - FPO_OTHER
                    - title: NATO_MOD
                      type: string
                      description: NATO or MoD
                      enum:
                      - NATO_MOD
                    - title: RMG
                      type: string
                      description: Royal Mail Group
                      enum:
                      - RMG
                    - title: ETOE
                      type: string
                      description: Extra-Territorial Office of Exchange
                      enum:
                      - ETOE
                  isUnaccompanied:
                    type: boolean
                    description: "Set to true if the vehicle will not be accompanying\
                      \ the trailer(s) during the crossing, or if the vehicle is carrying\
                      \ a container that will be detached and loaded for the crossing."
                    example: false
                  vehicleRegNum:
                    pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,30})?$"
                    type: string
                    description: Vehicle registration number of the vehicle that will
                      arrive at port.  If isUnaccompanied is set to false then vehicleRegNum
                      must be provided to check-in.
                    example: AB19 DEF
                  trailerRegistrationNums:
                    maxItems: 2
                    minItems: 1
                    uniqueItems: true
                    type: array
                    description: "For vehicles carrying trailers, the trailer registration\
                      \ number of each trailer.  If isUnaccompanied is set to true\
                      \ then trailerRegistrationNums or containerReferenceNums must\
                      \ be provided before check-in."
                    items:
                      pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
                      type: string
                      example: A1234567
                  containerReferenceNums:
                    minItems: 1
                    uniqueItems: true
                    type: array
                    description: "For vehicles arriving with containers that will\
                      \ be detached and loaded, the container reference number of\
                      \ each container in the movement. If isUnaccompanied is set\
                      \ to true then trailerRegistrationNums or containerReferenceNums\
                      \ must be provided before check-in."
                    items:
                      pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
                      type: string
                      example: CSQU3054383
                  plannedCrossing:
                    required:
                    - routeId
                    type: object
                    properties:
                      routeId:
                        pattern: "^[A-Z0-9-]{1,200}$"
                        type: string
                        description: "The ID of the crossing route, using a routeId\
                          \ from the GVMS reference data"
                        example: "18273"
                        default: ""
                      localDateTimeOfDeparture:
                        pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                        type: string
                        description: "The planned date and time of departure, in local\
                          \ time of the departure port. Must not include seconds,\
                          \ time zone or UTC marker"
                        example: 2021-08-11T10:58
                    additionalProperties: false
                    description: Details of the planned crossing.
                  checkedInCrossing:
                    required:
                    - localDateTimeOfArrival
                    - routeId
                    type: object
                    properties:
                      routeId:
                        pattern: "^[A-Z0-9-]{1,200}$"
                        type: string
                        description: "The ID of the crossing route, using a routeId\
                          \ from the GVMS reference data"
                        example: "18273"
                        default: ""
                      localDateTimeOfArrival:
                        pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                        type: string
                        description: "The planned date and time of arrival, in local\
                          \ time of the arrival port. Must not include seconds, time\
                          \ zone or UTC marker"
                        example: 2021-08-11T10:58
                    additionalProperties: false
                    description: Details of the crossing that the vehicle has been
                      checked-in to. These details will only be present in the Goods
                      Movement Record after the vehicle has checked in.
                  actualCrossing:
                    required:
                    - localDateTimeOfArrival
                    - routeId
                    type: object
                    properties:
                      routeId:
                        pattern: "^[A-Z0-9-]{1,200}$"
                        type: string
                        description: "The ID of the crossing route, using a routeId\
                          \ from the GVMS reference data"
                        example: "18273"
                        default: ""
                      localDateTimeOfArrival:
                        pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                        type: string
                        description: "The planned date and time of arrival, in local\
                          \ time of the arrival port. Must not include seconds, time\
                          \ zone or UTC marker"
                        example: 2021-08-11T10:58
                    additionalProperties: false
                    description: Details of the crossing that the goods movement has
                      been embarked on. These details will only be present in the
                      Goods Movement Record after the vehicle has embarked on a crossing.
                  sAndSMasterRefNums:
                    maxItems: 2500
                    minItems: 1
                    uniqueItems: true
                    type: array
                    description: The master reference numbers or Movement Reference
                      Numbers (MRNs) for Safety & Security declarations - should be
                      supplied where applicable.
                    items:
                      required:
                      - masterRefNum
                      type: object
                      properties:
                        masterRefNum:
                          pattern: "^[A-Z0-9-)(/]{1,200}$"
                          type: string
                          description: "The master reference number (MRN) for a Safety\
                            \ & Security declaration, where applicable."
                          example: GB12323020392
                  customsDeclarations:
                    minItems: 1
                    type: array
                    description: Details of the customs declarations within this goods
                      load.
                    items:
                      required:
                      - customsDeclarationId
                      type: object
                      properties:
                        customsDeclarationId:
                          pattern: "^[A-Z0-9-)(/]{1,200}$"
                          type: string
                          description: |-
                            This is the identifier for a customs declaration from Customs Declaration Service (CDS).

                            For inbound movements declared in CDS it is a MRN, for example 19GB4S24GC3PPFGVR7.

                            For outbound movements declared in CDS it is a DUCR, for example 0GB689223596000-SE119404.
                          example: 19GB4S24GC3PPFGVR7
                        sAndSMasterRefNum:
                          pattern: "^[A-Z0-9-)(/]{1,200}$"
                          type: string
                          description: "The master reference number or Movement Reference\
                            \ Number (MRN) for a Safety & Security declaration, where\
                            \ applicable. This must be supplied when the S&S declaration\
                            \ covers individual consignments within a trailer. This\
                            \ applies to both ENS and EXS declarations. If there is\
                            \ one, include the S&S MRN for the customs declaration\
                            \ above here. ENS will accept both the format of ICS2\
                            \ and ICSNI MRNs in GB_TO_NI direction"
                          example:
                          - GB12323020392
                      additionalProperties: false
                  mtpDeclaration:
                    type: object
                    properties:
                      mtpGoods:
                        minItems: 1
                        type: array
                        description: References for goods loads moving under a stamped
                          paper MTP.
                        items:
                          required:
                          - sAndSMasterRefNum
                          type: object
                          properties:
                            sAndSMasterRefNum:
                              pattern: "^[A-Z0-9-)(/]{1,200}$"
                              type: string
                              description: "The master reference number or Movement\
                                \ Reference Number (MRN) for a Safety & Security declaration,\
                                \ where applicable. This must be supplied when the\
                                \ S&S declaration covers individual Transit consignments\
                                \ within a trailer. This applies to both ENS and EXS\
                                \ declarations. If there is one, include the S&S MRN\
                                \ for the MTP declaration above here. ENS will accept\
                                \ both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
                                \ direction."
                              example:
                              - GB12323020392
                          additionalProperties: false
                    additionalProperties: false
                    description: "Details of a stamped, paper-based declaration using\
