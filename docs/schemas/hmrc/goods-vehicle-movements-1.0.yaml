openapi: 3.0.0
info:
  title: Goods Vehicle Movements
  description: API for creating and amending Goods Movement Records (GMRs) in the
    Goods Vehicle Movement Service
  version: "1.0"
servers:
- url: https://api.service.hmrc.gov.uk/
paths:
  /customs/goods-movement-system/movements:
    get:
      summary: List Goods Movement Records
      description: |
        This endpoint provides a list of all the Goods Movement Records (GMRs) that you have worked on over the last 28 days.

        The returned list of GMRs will contain summary information as per the example below. For the full GMR, use the Get Goods Movement Record endpoint.
      operationId: List Goods Movement Records
      parameters:
      - name: Accept
        in: header
        description: |
          Specifies the response format and the [version](/api-documentation/docs/reference-guide#versioning) of the API to be used.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: |
          An OAuth 2.0 Bearer Token.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: Bearer bb7fed3fe10dd235a2ccda3d50fb
      responses:
        "200":
          description: |
            All GMRs from the last 28 days are listed in the response body
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                  - createdDateTime
                  - direction
                  - gmrId
                  - state
                  - updatedDateTime
                  type: object
                  properties:
                    gmrId:
                      pattern: "^GMR[A-Z][0-9A-Z]{8}$"
                      type: string
                      description: The Goods Movement Record (GMR) ID for this GMR.  Do
                        not include when POSTing a GMR - GVMS will assign an ID.
                      example: GMRA000002JR
                    direction:
                      type: string
                      description: "The direction of the movement - into or out of\
                        \ the UK, or between Great Britain and Northern Ireland"
                      oneOf:
                      - title: UK_INBOUND
                        type: string
                        description: The movement is travelling into the UK
                        enum:
                        - UK_INBOUND
                      - title: UK_OUTBOUND
                        type: string
                        description: The movement is travelling out of the UK
                        enum:
                        - UK_OUTBOUND
                      - title: GB_TO_NI
                        type: string
                        description: The movement is travelling out of Great Britain
                          into Northern Ireland
                        enum:
                        - GB_TO_NI
                      - title: NI_TO_GB
                        type: string
                        description: The movement is travelling out of Northern Ireland
                          into Great Britain
                        enum:
                        - NI_TO_GB
                    isUnaccompanied:
                      type: boolean
                      description: "Set to true if the vehicle will not be accompanying\
                        \ the trailer(s) during the crossing, or if the vehicle is\
                        \ carrying a container that will be detached and loaded for\
                        \ the crossing."
                      example: false
                    inspectionRequired:
                      type: boolean
                      description: "If set to true, indicates that the vehicle requires\
                        \ a customs inspection.  If set to false, indicates that the\
                        \ vehicle does not require a customs inspection.  If not set,\
                        \ indicates the customs inspection decision has not yet been\
                        \ made or is not applicable.  For outbound GMRs, this indicates\
                        \ that the vehicle must present at an inspection facility\
                        \ prior to checking-in at the port.  For Office of Transit\
                        \ inspections for inbound GMRs, a decision may be made to\
                        \ inspect subsequent to a notification that inspection is\
                        \ not required.  In this event a notification will be sent\
                        \ that changes inspectionRequired from false to true.  If\
                        \ this happens after leaving the port of arrival, the inspection\
                        \ should be carried out at the next transit office e.g. the\
                        \ office of destination."
                    reportToLocations:
                      minItems: 1
                      type: array
                      description: "A list of one or more inspection types, from GVMS\
                        \ Reference Data, that the vehicle must have carried out,\
                        \ in the order specified.  This means that where there are\
                        \ multiple entries here, the vehicle must report for the first\
                        \ inspection type listed before each subsequent listed inspection.\
                        \  Each entry includes a list of available locations for the\
                        \ inspection type."
                      items:
                        required:
                        - inspectionTypeId
                        - locationIds
                        type: object
                        properties:
                          inspectionTypeId:
                            pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                            type: string
                            description: An inspectionTypeId from GVMS Reference Data
                              denoting the type of inspection that needs to be performed
                              on the vehicle.
                            example: "7"
                          locationIds:
                            type: array
                            description: A list of locationIds from GVMS Reference
                              Data that are available to perform this type of inspection.
                            example: L0029A
                            items:
                              pattern: "^[0-9A-Za-z\\-_]{1,100}$"
                              type: string
                        description: Information about an inspection that is required
                        example:
                          inspectionTypeId: "1"
                          locationIds:
                          - L0029A
                          - L0030A
                    vehicleRegNum:
                      pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,30})?$"
                      type: string
                      description: Vehicle registration number of the vehicle that
                        will arrive at port.  If isUnaccompanied is set to false then
                        vehicleRegNum must be provided to check-in.
                      example: AB19 DEF
                    trailerRegistrationNums:
                      maxItems: 2
                      minItems: 1
                      uniqueItems: true
                      type: array
                      description: "For vehicles carrying trailers, the trailer registration\
                        \ number of each trailer.  If isUnaccompanied is set to true\
                        \ then trailerRegistrationNums or containerReferenceNums must\
                        \ be provided before check-in."
                      items:
                        pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
                        type: string
                        example: A1234567
                    containerReferenceNums:
                      minItems: 1
                      uniqueItems: true
                      type: array
                      description: "For vehicles arriving with containers that will\
                        \ be detached and loaded, the container reference number of\
                        \ each container in the movement. If isUnaccompanied is set\
                        \ to true then trailerRegistrationNums or containerReferenceNums\
                        \ must be provided before check-in."
                      items:
                        pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
                        type: string
                        example: CSQU3054383
                    state:
                      type: string
                      description: The state of the GMR
                      example: NOT_FINALISABLE
                      oneOf:
                      - title: NOT_FINALISABLE
                        type: string
                        description: The GMR is in a non-finalisable state.  This
                          means an update will be required from the haulier prior
                          to check-in.
                        enum:
                        - NOT_FINALISABLE
                      - title: OPEN
                        type: string
                        description: The GMR is open for updates and is ready for
                          check-in.
                        enum:
                        - OPEN
                      - title: CHECKED_IN
                        type: string
                        description: "The GMR is checked-in, awaiting embarkation\
                          \ confirmation from the carrier."
                        enum:
                        - CHECKED_IN
                      - title: EMBARKED
                        type: string
                        description: "The GMR is embarked, meaning the goods movement\
                          \ has embarked on its crossing but the goods are awaiting\
                          \ clearance to proceed."
                        enum:
                        - EMBARKED
                      - title: COMPLETED
                        type: string
                        description: "The GMR is completed, meaning the goods movement\
                          \ has embarked on its crossing and the goods are clear to\
                          \ proceed."
                        enum:
                        - COMPLETED
                    createdDateTime:
                      pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\\
                        d.\\d{3}Z$"
                      type: string
                      description: The date and time that this GMR was created.
                      example: 2021-08-11T10:58:12
                    updatedDateTime:
                      pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d:[0-5]\\\
                        d.\\d{3}Z$"
                      type: string
                      description: The date and time that this GMR was last updated.
                      example: 2021-08-12T15:34:02
                    plannedCrossing:
                      required:
                      - routeId
                      type: object
                      properties:
                        routeId:
                          pattern: "^[A-Z0-9-]{1,200}$"
                          type: string
                          description: "The ID of the crossing route, using a routeId\
                            \ from the GVMS reference data"
                          example: "18273"
                          default: ""
                        localDateTimeOfDeparture:
                          pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                          type: string
                          description: "The planned date and time of departure, in\
                            \ local time of the departure port. Must not include seconds,\
                            \ time zone or UTC marker"
                          example: 2021-08-11T10:58
                      additionalProperties: false
                      description: Details of the planned crossing.
                    checkedInCrossing:
                      required:
                      - localDateTimeOfArrival
                      - routeId
                      type: object
                      properties:
                        routeId:
                          pattern: "^[A-Z0-9-]{1,200}$"
                          type: string
                          description: "The ID of the crossing route, using a routeId\
                            \ from the GVMS reference data"
                          example: "18273"
                          default: ""
                        localDateTimeOfArrival:
                          pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                          type: string
                          description: "The planned date and time of arrival, in local\
                            \ time of the arrival port. Must not include seconds,\
                            \ time zone or UTC marker"
                          example: 2021-08-11T10:58
                      additionalProperties: false
                      description: Details of the crossing that the vehicle has been
                        checked-in to. These details will only be present in the Goods
                        Movement Record after the vehicle has checked in.
                    actualCrossing:
                      required:
                      - localDateTimeOfArrival
                      - routeId
                      type: object
                      properties:
                        routeId:
                          pattern: "^[A-Z0-9-]{1,200}$"
                          type: string
                          description: "The ID of the crossing route, using a routeId\
                            \ from the GVMS reference data"
                          example: "18273"
                          default: ""
                        localDateTimeOfArrival:
                          pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                          type: string
                          description: "The planned date and time of arrival, in local\
                            \ time of the arrival port. Must not include seconds,\
                            \ time zone or UTC marker"
                          example: 2021-08-11T10:58
                      additionalProperties: false
                      description: Details of the crossing that the goods movement
                        has been embarked on. These details will only be present in
                        the Goods Movement Record after the vehicle has embarked on
                        a crossing.
                    links:
                      type: array
                      description: A list of endpoint links that indicate possible
                        actions related to the current resource
                      items:
                        required:
                        - href
                        - method
                        - rel
                        type: object
                        properties:
                          href:
                            type: string
                            description: The relative URL of the endpoint
                            example: /customs/goods-movement-system/movements/GMRB-0000-0A9C
                          method:
                            type: string
                            description: The HTTP method type for the endpoint
                            example: GET
                            oneOf:
                            - title: GET
                              type: string
                              description: The HTTP method for the endpoint
                              enum:
                              - GET
                          rel:
                            type: string
                            description: "A label for the endpoint, which describes\
                              \ how it is related to the current resource. The rel\
                              \ will be self where the action is retrieval of the\
                              \ same resource."
                            example: get-goods-movement-record
                            oneOf:
                            - title: get-goods-movement-record
                              type: string
                              description: "A label for the endpoint, which describes\
                                \ how it is related to the current resource. The rel\
                                \ will be self where the action is retrieval of the\
                                \ same resource."
                              enum:
                              - get-goods-movement-record
                        description: An endpoint link that indicates a possible action
                          related to the current resource
                        example:
                          rel: get-goods-movement-record
                          href: /customs/goods-movement-system/movements/GMRB00000A9C
                          method: GET
              examples:
                listOfGmrs:
                  summary: A list of GMRs
                  description: A list of GMRs
                  value:
                  - gmrId: GMRA000000F8
                    direction: UK_INBOUND
                    vehicleRegNum: AB19 DEF
                    isUnaccompanied: false
                    state: NOT_FINALISABLE
                    createdDateTime: 2020-06-11T09:48:21.592Z
                    updatedDateTime: 2020-06-14T13:12:03.237Z
                    plannedCrossing:
                      routeId: "60"
                    links:
                    - href: /customs/goods-movement-system/movements/GMRA000000F8
                      method: GET
                      rel: get-goods-movement-record
                  - gmrId: GMRB00000A9C
                    direction: UK_OUTBOUND
                    vehicleRegNum: GU51 ABC
                    state: OPEN
                    plannedCrossing:
                      routeId: "63"
                      localDateTimeOfDeparture: 2021-08-11T10:58
                    createdDateTime: 2020-06-09T09:42:15.362Z
                    updatedDateTime: 2020-06-09T12:12:09.283Z
                    links:
                    - href: /customs/goods-movement-system/movements/GMRB00000A9C
                      method: GET
                      rel: get-goods-movement-record
                  - gmrId: GMRA0000028D
                    direction: UK_INBOUND
                    vehicleRegNum: KL58 FEM
                    state: EMBARKED
                    inspectionRequired: true
                    reportToLocations:
                    - inspectionTypeId: "1"
                      locationIds:
                      - L0029A
                      - L0030A
                      - L0031A
                    - inspectionTypeId: "2"
                      locationIds:
                      - L0029A
                      - L0031A
                    plannedCrossing:
                      routeId: "60"
                    checkedInCrossing:
                      routeId: "60"
                      localDateTimeOfArrival: 2021-06-11T10:58
                    actualCrossing:
                      routeId: "60"
                      localDateTimeOfArrival: 2021-06-11T11:03
                    createdDateTime: 2020-06-08T08:42:11.901Z
                    updatedDateTime: 2020-06-08T15:23:55.471Z
                    links:
                    - href: /customs/goods-movement-system/movements/GMRA0000028D
                      method: GET
                      rel: get-goods-movement-record
        "400":
          description: ""
          content:
            application/json:
              schema:
                title: error-response
                required:
                - code
                type: object
                properties:
                  code:
                    type: string
              examples:
                INVALID_JSON_FORMAT:
                  description: |
                    The request body is not a valid JSON format.
                  value:
                    code: INVALID_JSON_FORMAT
                JSON_SCHEMA_ERROR:
                  description: |
                    The request body does not conform to the expected JSON schema.
                  value:
                    code: JSON_SCHEMA_ERROR
      security:
      - userRestricted:
        - write:goods-movement-system
    post:
      summary: Create a Goods Movement Record (GMR)
      description: |
        This endpoint is used to create a Goods Movement Record (GMR).

        When creating, you can provide the full record or you can provide incomplete information and update it later using the Update GMR endpoint.

        Check-in will not be possible until the record is fully updated.

        If the GMR you POST is schematically invalid, you will receive details of the schematic errors in a 400 error response.

        If the GMR you POST is schematically valid, the endpoint will respond with a 202 Accepted and you will receive a notification after a few seconds detailing the status of the GMR.  This notification will confirm if the GMR is "open", i.e.  ready to be checked-in or "not finalisable", i.e. an update to the GMR is required.

        If it is "not finalisable" then the parts of the GMR that are invalid or missing will be identified in the notification.
      operationId: create-gmr
      parameters:
      - name: Content-Type
        in: header
        description: |
          Specifies the format of the request body, which must be JSON.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/json
      - name: Accept
        in: header
        description: |
          Specifies the response format and the [version](/api-documentation/docs/reference-guide#versioning) of the API to be used.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: |
          An OAuth 2.0 Bearer Token.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: Bearer bb7fed3fe10dd235a2ccda3d50fb
      requestBody:
        content:
          application/json:
            schema:
              title: goodsMovementRecord
              required:
              - direction
              type: object
              not:
                anyOf:
                - required:
                  - customsDeclarations
                  - emptyVehicle
                - required:
                  - emptyVehicle
                  - transitDeclarations
                - required:
                  - emptyVehicle
                  - mtpDeclaration
                - required:
                  - emptyVehicle
                  - tirDeclarations
                - required:
                  - ataDeclarations
                  - emptyVehicle
                - required:
                  - eidrDeclarations
                  - emptyVehicle
                - required:
                  - emptyVehicle
                  - ukimsEidrDeclarations
                - required:
                  - emptyVehicle
                  - indirectExportDeclarations
                - required:
                  - dbcDeclaration
                  - emptyVehicle
                - required:
                  - emptyVehicle
                  - exemptionDeclaration
                - required:
                  - emptyVehicle
                  - ukcDeclaration
              properties:
                direction:
                  type: string
                  description: "The direction of the movement - into or out of the\
                    \ UK, or between Great Britain and Northern Ireland"
                  oneOf:
                  - title: UK_INBOUND
                    type: string
                    description: The movement is travelling into the UK
                    enum:
                    - UK_INBOUND
                  - title: UK_OUTBOUND
                    type: string
                    description: The movement is travelling out of the UK
                    enum:
                    - UK_OUTBOUND
                  - title: GB_TO_NI
                    type: string
                    description: The movement is travelling out of Great Britain into
                      Northern Ireland
                    enum:
                    - GB_TO_NI
                  - title: NI_TO_GB
                    type: string
                    description: The movement is travelling out of Northern Ireland
                      into Great Britain
                    enum:
                    - NI_TO_GB
                haulierType:
                  type: string
                  description: The type of haulier moving the goods
                  example: STANDARD
                  oneOf:
                  - title: STANDARD
                    type: string
                    description: All hauliers that are not one of the other types
                    enum:
                    - STANDARD
                  - title: FPO_ASN
                    type: string
                    description: Fast parcel operators that are members of the Anti-Smuggling
                      Network
                    enum:
                    - FPO_ASN
                  - title: FPO_OTHER
                    type: string
                    description: Fast parcel operators that are not members of the
                      ASN and are not moving goods with a Memorandum of Understanding
                    enum:
                    - FPO_OTHER
                  - title: NATO_MOD
                    type: string
                    description: NATO or MoD
                    enum:
                    - NATO_MOD
                  - title: RMG
                    type: string
                    description: Royal Mail Group
                    enum:
                    - RMG
                  - title: ETOE
                    type: string
                    description: Extra-Territorial Office of Exchange
                    enum:
                    - ETOE
                isUnaccompanied:
                  type: boolean
                  description: "Set to true if the vehicle will not be accompanying\
                    \ the trailer(s) during the crossing, or if the vehicle is carrying\
                    \ a container that will be detached and loaded for the crossing."
                  example: false
                vehicleRegNum:
                  pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,30})?$"
                  type: string
                  description: Vehicle registration number of the vehicle that will
                    arrive at port.  If isUnaccompanied is set to false then vehicleRegNum
                    must be provided to check-in.
                  example: AB19 DEF
                trailerRegistrationNums:
                  maxItems: 2
                  minItems: 1
                  uniqueItems: true
                  type: array
                  description: "For vehicles carrying trailers, the trailer registration\
                    \ number of each trailer.  If isUnaccompanied is set to true then\
                    \ trailerRegistrationNums or containerReferenceNums must be provided\
                    \ before check-in."
                  items:
                    pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
                    type: string
                    example: A1234567
                containerReferenceNums:
                  minItems: 1
                  uniqueItems: true
                  type: array
                  description: "For vehicles arriving with containers that will be\
                    \ detached and loaded, the container reference number of each\
                    \ container in the movement. If isUnaccompanied is set to true\
                    \ then trailerRegistrationNums or containerReferenceNums must\
                    \ be provided before check-in."
                  items:
                    pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
                    type: string
                    example: CSQU3054383
                plannedCrossing:
                  required:
                  - routeId
                  type: object
                  properties:
                    routeId:
                      pattern: "^[A-Z0-9-]{1,200}$"
                      type: string
                      description: "The ID of the crossing route, using a routeId\
                        \ from the GVMS reference data"
                      example: "18273"
                      default: ""
                    localDateTimeOfDeparture:
                      pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                      type: string
                      description: "The planned date and time of departure, in local\
                        \ time of the departure port. Must not include seconds, time\
                        \ zone or UTC marker"
                      example: 2021-08-11T10:58
                  additionalProperties: false
                  description: Details of the planned crossing.
                sAndSMasterRefNums:
                  maxItems: 2500
                  minItems: 1
                  uniqueItems: true
                  type: array
                  description: The master reference numbers or Movement Reference
                    Numbers (MRNs) for Safety & Security declarations - should be
                    supplied where applicable.
                  items:
                    required:
                    - masterRefNum
                    type: object
                    properties:
                      masterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number (MRN) for a Safety\
                          \ & Security declaration, where applicable."
                        example: GB12323020392
                customsDeclarations:
                  minItems: 1
                  type: array
                  description: Details of the customs declarations within this goods
                    load.
                  items:
                    required:
                    - customsDeclarationId
                    type: object
                    properties:
                      customsDeclarationId:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: |-
                          This is the identifier for a customs declaration from Customs Declaration Service (CDS).

                          For inbound movements declared in CDS it is a MRN, for example 19GB4S24GC3PPFGVR7.

                          For outbound movements declared in CDS it is a DUCR, for example 0GB689223596000-SE119404.
                        example: 19GB4S24GC3PPFGVR7
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers individual consignments within a trailer. This\
                          \ applies to both ENS and EXS declarations. If there is\
                          \ one, include the S&S MRN for the customs declaration above\
                          \ here. ENS will accept both the format of ICS2 and ICSNI\
                          \ MRNs in GB_TO_NI direction"
                        example:
                        - GB12323020392
                    additionalProperties: false
                mtpDeclaration:
                  type: object
                  properties:
                    mtpGoods:
                      minItems: 1
                      type: array
                      description: References for goods loads moving under a stamped
                        paper MTP.
                      items:
                        required:
                        - sAndSMasterRefNum
                        type: object
                        properties:
                          sAndSMasterRefNum:
                            pattern: "^[A-Z0-9-)(/]{1,200}$"
                            type: string
                            description: "The master reference number or Movement\
                              \ Reference Number (MRN) for a Safety & Security declaration,\
                              \ where applicable. This must be supplied when the S&S\
                              \ declaration covers individual Transit consignments\
                              \ within a trailer. This applies to both ENS and EXS\
                              \ declarations. If there is one, include the S&S MRN\
                              \ for the MTP declaration above here. ENS will accept\
                              \ both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
                              \ direction."
                            example:
                            - GB12323020392
                        additionalProperties: false
                  additionalProperties: false
                  description: "Details of a stamped, paper-based declaration using\
                    \ a Manual Transit Procedure (MTP).  Only intended for use when\
                    \ technical issues prevent use of Transit IT systems."
                transitDeclarations:
                  minItems: 1
                  type: array
                  description: Details of the transit declarations within this goods
                    load.
                  items:
                    required:
                    - isTSAD
                    - transitDeclarationId
                    type: object
                    properties:
                      transitDeclarationId:
                        pattern: "^\\d{2}[A-Z]{2}[A-Z0-9]{14}$"
                        type: string
                        description: This is the Transit MRN issued by the Office
                          of Departure.  Must be provided.
                        example: 18AT320000TVWJYM68
                      isTSAD:
                        type: boolean
                        description: "Set to true if the transit declaration is a\
                          \ TSAD, otherwise set to false (for a TAD)"
                        example: false
                      sAndSMasterRefNum:
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers individual Transit consignments within a trailer.\
                          \ This applies to both ENS and EXS declarations. If there\
                          \ is one, include the S&S MRN for the Transit declaration\
                          \ above here. ENS will accept both the format of ICS2 and\
                          \ ICSNI MRNs in GB_TO_NI direction."
                        oneOf:
                        - pattern: "^[A-Z0-9-)(/]{1,200}$"
                          type: string
                          description: "The master reference number (MRN) for a Safety\
                            \ & Security declaration, where applicable."
                          example: GB12323020392
                    additionalProperties: false
                tirDeclarations:
                  minItems: 1
                  type: array
                  description: Details of one or more TIR Carnet declarations.  Must
                    be provided prior to check-in for TIR movements.
                  items:
                    required:
                    - tirCarnetId
                    type: object
                    properties:
                      tirCarnetId:
                        pattern: "^.{1,200}$"
                        type: string
                        description: The TIR Carnet ID for the carnet within a TIR
                          goods movement
                        example: ABC/123
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers TIR Carnet consignments within a trailer. This\
                          \ applies to both ENS and EXS declarations. If there is\
                          \ one, include the S&S MRN for the TIR declaration above\
                          \ here. ENS will accept both the format of ICS2 and ICSNI\
                          \ MRNs in GB_TO_NI direction."
                        example:
                        - GB12323020392
                    additionalProperties: false
                ataDeclarations:
                  minItems: 1
                  type: array
                  description: Details of one or more ATA Carnet declarations.  Must
                    be provided prior to check-in for ATA movements.
                  items:
                    required:
                    - ataCarnetId
                    type: object
                    properties:
                      ataCarnetId:
                        pattern: "^.{1,200}$"
                        type: string
                        description: The ATA Carnet ID for the carnet within an ATA
                          goods movement
                        example: ABC/123
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers ATA Carnet consignments within a trailer. This\
                          \ applies to both ENS and EXS declarations. If there is\
                          \ one, include the S&S MRN for the ATA declaration above\
                          \ here. ENS will accept both the format of ICS2 and ICSNI\
                          \ MRNs in GB_TO_NI direction."
                        example:
                        - GB12323020392
                    additionalProperties: false
                eidrDeclarations:
                  minItems: 1
                  type: array
                  description: "Details of one or more EIDR declarations.  Must be\
                    \ provided prior to check-in for EIDR movements.  For movements\
                    \ using a specially-issued EORI, the same EORI may be entered\
                    \ multiple times, one entry for each ENS S&S MRN travelling under\
                    \ EIDR."
                  items:
                    required:
                    - traderEORI
                    type: object
                    properties:
                      traderEORI:
                        pattern: "^(?:(?:GB|XI)[0-9]{12,15}|(?!GB|XI)[A-Z]{2}[0-9A-Z]{1,15})$"
                        type: string
                        description: "The trader's EORI, GB EORIs are valid for all\
                          \ direction movements, XI and EU EORIs are valid for only\
                          \ GB to NI movements."
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers individual EIDR consignments within a trailer.\
                          \ This applies to both ENS and EXS declarations. If there\
                          \ is one, include the S&S MRN for the EIDR declaration above\
                          \ here. ENS will accept both the format of ICS2 and ICSNI\
                          \ MRNs in GB_TO_NI direction."
                        example:
                        - GB12323020392
                      localReferenceNumber:
                        pattern: "^[A-Z0-9]{1,22}$"
                        type: string
                        description: It is only used for EIDR and UKIMS EIDR declarations
                          in the GB_TO_NI direction
                      procedureCode:
                        pattern: "^[0-9]{4}$"
                        type: string
                        description: It is only used for EIDR declarations in the
                          GB_TO_NI direction
                    additionalProperties: false
                ukimsEidrDeclarations:
                  minItems: 1
                  type: array
                  description: Details of one or more UKIMS EIDR declarations.
                  items:
                    required:
                    - traderEORI
                    type: object
                    properties:
                      traderEORI:
                        pattern: "^[A-Z]{2}[0-9]{12,15}$"
                        type: string
                        description: "The trader's EORI, only XI EORIs are valid."
                      nopWaiver:
                        type: boolean
                      localReferenceNumber:
                        pattern: "^[A-Z0-9]{1,22}$"
                        type: string
                        description: It is only used for EIDR and UKIMS EIDR declarations
                          in the GB_TO_NI direction
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers individual UKIMS EIDR consignments within a trailer.\
                          \ This applies to both ENS and EXS declarations. If there\
                          \ is one, include the S&S MRN for the UKIMS EIDR declaration\
                          \ above here."
                        example:
                        - GB12323020392
                    additionalProperties: false
                indirectExportDeclarations:
                  minItems: 1
                  type: array
                  description: Details of the indirect export declarations within
                    this goods load.  Only valid for NI to GB movements where the
                    goods originated from outside UK.
                  items:
                    required:
                    - eadMasterRefNum
                    type: object
                    properties:
                      eadMasterRefNum:
                        pattern: "^\\d{2}(?!GB|XI)[A-Z]{2}[A-Z0-9]{14}$"
                        type: string
                        description: The master or movement reference number (MRN)
                          of the Export Accompanying Document (EAD) for this indirect
                          export.
                        example: 19IE294000AFGRIG29
                    additionalProperties: false
                emptyVehicle:
                  required:
                  - isOwnVehicle
                  type: object
                  properties:
                    isOwnVehicle:
                      type: boolean
                      description: Set to false if the haulier is moving the goods
                        vehicle under a contract of carriage.  Set to true if there
                        is no contract of carriage.
                      example: false
                    sAndSMasterRefNum:
                      pattern: "^[A-Z0-9-)(/]{1,200}$"
                      type: string
                      description: "The master reference number (MRN) for a Safety\
                        \ & Security declaration, where applicable."
                      example: GB12323020392
                  additionalProperties: false
                  description: Declares that this is an empty movement and contains
                    details about the empty movement.  Must be provided prior to check-in
                    for empty movements.
                dbcDeclaration:
                  required:
                  - isOwnVehicle
                  type: object
                  properties:
                    isOwnVehicle:
                      type: boolean
                      description: Set to false if the haulier is moving the goods
                        vehicle under a contract of carriage.  Set to true if there
                        is no contract of carriage.
                      example: false
                    dbcGoods:
                      minItems: 1
                      type: array
                      description: References for a Declaration by Conduct goods load.
                      items:
                        required:
                        - sAndSMasterRefNum
                        type: object
                        properties:
                          sAndSMasterRefNum:
                            pattern: "^[A-Z0-9-)(/]{1,200}$"
                            type: string
                            description: "The master reference number or Movement\
                              \ Reference Number (MRN) for a Safety & Security declaration,\
                              \ where applicable. This may be required when the S&S\
                              \ declaration covers a DBC that is moving under a contract\
                              \ of carriage. This applies to both ENS and EXS declarations."
                            example:
                            - GB12323020392
                        additionalProperties: false
                  additionalProperties: false
                  description: Declares goods moving under Declaration by Conduct.  Refer
                    to the Oral and By Conduct List published at gov.uk for details.
                exemptionDeclaration:
                  type: object
                  properties:
                    exemptedGoods:
                      minItems: 1
                      type: array
                      description: The list of goods loads exempted from customs.  Used
                        for GB>NI RMG <£900 B2B or GB>EU FPO+MOU goods loads.
                      items:
                        required:
                        - sAndSMasterRefNum
                        type: object
                        properties:
                          sAndSMasterRefNum:
                            pattern: "^[A-Z0-9-)(/]{1,200}$"
                            type: string
                            description: The MRN or DUCR (depending on direction)
                              for an ENS or EXS Safety & Security declaration for
                              this goods load. ENS will accept both the format of
                              ICS2 and ICSNI MRNs in GB_TO_NI direction.
                            example:
                            - GB12323020392
                        additionalProperties: false
                  additionalProperties: false
                  description: Declares Royal Mail Group or ETOE goods in the movement
                    that do not require a customs declaration.
                ukcDeclaration:
                  required:
                  - fpoEORI
                  type: object
                  properties:
                    fpoEORI:
                      pattern: "^[A-Z]{2}[0-9]{12,15}$"
                      type: string
                      description: GB or XI EORI for UK-C
                  additionalProperties: false
                  description: Details of UK-C declaration.
              additionalProperties: false
