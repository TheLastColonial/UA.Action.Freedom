    put:
      summary: Update Goods Movement Record
      description: "This endpoint updates a Goods Movement Record (GMR).\n\nWhen updating,\
        \ you can provide the full record or you can provide incomplete information\
        \ and update it again later.  \n\nIf the GMR you POST is schematically invalid,\
        \ you will receive details of the schematic errors in a 400 error response.\n\
        \nIf the GMR you POST is schematically valid, the endpoint will respond with\
        \ a 202 Accepted and you will receive a notification after a few seconds detailing\
        \ the status of the GMR. This notification will confirm if the GMR is \"open\"\
        , i.e. ready to be checked-in or \"not finalisable\". In either case, updates\
        \ with the PUT API can be made.\n\nIf it is \"not finalisable\" then the parts\
        \ of the GMR that are invalid or missing will be identified in the notification.\n\
        \nThe direction of a GMR cannot be updated. If the direction is incorrect\
        \ the GMR must be deleted and a new one created.\n"
      operationId: Update Goods Movement Record
      parameters:
      - name: gmrId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: |
            The ID of a Goods Movement Record (GMR)
        example: GMRI00000A45
      - name: Content-Type
        in: header
        description: |
          Specifies the format of the request body, which must be JSON.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/json
      - name: Accept
        in: header
        description: |
          Specifies the response format and the [version](/api-documentation/docs/reference-guide#versioning) of the API to be used.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: |
          An OAuth 2.0 Bearer Token.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: Bearer bb7fed3fe10dd235a2ccda3d50fb
      requestBody:
        content:
          application/json:
            schema:
              title: goodsMovementRecord
              required:
              - direction
              type: object
              not:
                anyOf:
                - required:
                  - customsDeclarations
                  - emptyVehicle
                - required:
                  - emptyVehicle
                  - transitDeclarations
                - required:
                  - emptyVehicle
                  - mtpDeclaration
                - required:
                  - emptyVehicle
                  - tirDeclarations
                - required:
                  - ataDeclarations
                  - emptyVehicle
                - required:
                  - eidrDeclarations
                  - emptyVehicle
                - required:
                  - emptyVehicle
                  - ukimsEidrDeclarations
                - required:
                  - emptyVehicle
                  - indirectExportDeclarations
                - required:
                  - dbcDeclaration
                  - emptyVehicle
                - required:
                  - emptyVehicle
                  - exemptionDeclaration
                - required:
                  - emptyVehicle
                  - ukcDeclaration
              properties:
                direction:
                  type: string
                  description: "The direction of the movement - into or out of the\
                    \ UK, or between Great Britain and Northern Ireland"
                  oneOf:
                  - title: UK_INBOUND
                    type: string
                    description: The movement is travelling into the UK
                    enum:
                    - UK_INBOUND
                  - title: UK_OUTBOUND
                    type: string
                    description: The movement is travelling out of the UK
                    enum:
                    - UK_OUTBOUND
                  - title: GB_TO_NI
                    type: string
                    description: The movement is travelling out of Great Britain into
                      Northern Ireland
                    enum:
                    - GB_TO_NI
                  - title: NI_TO_GB
                    type: string
                    description: The movement is travelling out of Northern Ireland
                      into Great Britain
                    enum:
                    - NI_TO_GB
                haulierType:
                  type: string
                  description: The type of haulier moving the goods
                  example: STANDARD
                  oneOf:
                  - title: STANDARD
                    type: string
                    description: All hauliers that are not one of the other types
                    enum:
                    - STANDARD
                  - title: FPO_ASN
                    type: string
                    description: Fast parcel operators that are members of the Anti-Smuggling
                      Network
                    enum:
                    - FPO_ASN
                  - title: FPO_OTHER
                    type: string
                    description: Fast parcel operators that are not members of the
                      ASN and are not moving goods with a Memorandum of Understanding
                    enum:
                    - FPO_OTHER
                  - title: NATO_MOD
                    type: string
                    description: NATO or MoD
                    enum:
                    - NATO_MOD
                  - title: RMG
                    type: string
                    description: Royal Mail Group
                    enum:
                    - RMG
                  - title: ETOE
                    type: string
                    description: Extra-Territorial Office of Exchange
                    enum:
                    - ETOE
                isUnaccompanied:
                  type: boolean
                  description: "Set to true if the vehicle will not be accompanying\
                    \ the trailer(s) during the crossing, or if the vehicle is carrying\
                    \ a container that will be detached and loaded for the crossing."
                  example: false
                vehicleRegNum:
                  pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,30})?$"
                  type: string
                  description: Vehicle registration number of the vehicle that will
                    arrive at port.  If isUnaccompanied is set to false then vehicleRegNum
                    must be provided to check-in.
                  example: AB19 DEF
                trailerRegistrationNums:
                  maxItems: 2
                  minItems: 1
                  uniqueItems: true
                  type: array
                  description: "For vehicles carrying trailers, the trailer registration\
                    \ number of each trailer.  If isUnaccompanied is set to true then\
                    \ trailerRegistrationNums or containerReferenceNums must be provided\
                    \ before check-in."
                  items:
                    pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
                    type: string
                    example: A1234567
                containerReferenceNums:
                  minItems: 1
                  uniqueItems: true
                  type: array
                  description: "For vehicles arriving with containers that will be\
                    \ detached and loaded, the container reference number of each\
                    \ container in the movement. If isUnaccompanied is set to true\
                    \ then trailerRegistrationNums or containerReferenceNums must\
                    \ be provided before check-in."
                  items:
                    pattern: "^[A-Z0-9-](?:[A-Z0-9 -]{1,199})?$"
                    type: string
                    example: CSQU3054383
                plannedCrossing:
                  required:
                  - routeId
                  type: object
                  properties:
                    routeId:
                      pattern: "^[A-Z0-9-]{1,200}$"
                      type: string
                      description: "The ID of the crossing route, using a routeId\
                        \ from the GVMS reference data"
                      example: "18273"
                      default: ""
                    localDateTimeOfDeparture:
                      pattern: "^\\d{4}-[01]\\d-[0-3]\\dT[0-2]\\d:[0-5]\\d$"
                      type: string
                      description: "The planned date and time of departure, in local\
                        \ time of the departure port. Must not include seconds, time\
                        \ zone or UTC marker"
                      example: 2021-08-11T10:58
                  additionalProperties: false
                  description: Details of the planned crossing.
                sAndSMasterRefNums:
                  maxItems: 2500
                  minItems: 1
                  uniqueItems: true
                  type: array
                  description: The master reference numbers or Movement Reference
                    Numbers (MRNs) for Safety & Security declarations - should be
                    supplied where applicable.
                  items:
                    required:
                    - masterRefNum
                    type: object
                    properties:
                      masterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number (MRN) for a Safety\
                          \ & Security declaration, where applicable."
                        example: GB12323020392
                customsDeclarations:
                  minItems: 1
                  type: array
                  description: Details of the customs declarations within this goods
                    load.
                  items:
                    required:
                    - customsDeclarationId
                    type: object
                    properties:
                      customsDeclarationId:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: |-
                          This is the identifier for a customs declaration from Customs Declaration Service (CDS).

                          For inbound movements declared in CDS it is a MRN, for example 19GB4S24GC3PPFGVR7.

                          For outbound movements declared in CDS it is a DUCR, for example 0GB689223596000-SE119404.
                        example: 19GB4S24GC3PPFGVR7
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers individual consignments within a trailer. This\
                          \ applies to both ENS and EXS declarations. If there is\
                          \ one, include the S&S MRN for the customs declaration above\
                          \ here. ENS will accept both the format of ICS2 and ICSNI\
                          \ MRNs in GB_TO_NI direction"
                        example:
                        - GB12323020392
                    additionalProperties: false
                mtpDeclaration:
                  type: object
                  properties:
                    mtpGoods:
                      minItems: 1
                      type: array
                      description: References for goods loads moving under a stamped
                        paper MTP.
                      items:
                        required:
                        - sAndSMasterRefNum
                        type: object
                        properties:
                          sAndSMasterRefNum:
                            pattern: "^[A-Z0-9-)(/]{1,200}$"
                            type: string
                            description: "The master reference number or Movement\
                              \ Reference Number (MRN) for a Safety & Security declaration,\
                              \ where applicable. This must be supplied when the S&S\
                              \ declaration covers individual Transit consignments\
                              \ within a trailer. This applies to both ENS and EXS\
                              \ declarations. If there is one, include the S&S MRN\
                              \ for the MTP declaration above here. ENS will accept\
                              \ both the format of ICS2 and ICSNI MRNs in GB_TO_NI\
                              \ direction."
                            example:
                            - GB12323020392
                        additionalProperties: false
                  additionalProperties: false
                  description: "Details of a stamped, paper-based declaration using\
                    \ a Manual Transit Procedure (MTP).  Only intended for use when\
                    \ technical issues prevent use of Transit IT systems."
                transitDeclarations:
                  minItems: 1
                  type: array
                  description: Details of the transit declarations within this goods
                    load.
                  items:
                    required:
                    - isTSAD
                    - transitDeclarationId
                    type: object
                    properties:
                      transitDeclarationId:
                        pattern: "^\\d{2}[A-Z]{2}[A-Z0-9]{14}$"
                        type: string
                        description: This is the Transit MRN issued by the Office
                          of Departure.  Must be provided.
                        example: 18AT320000TVWJYM68
                      isTSAD:
                        type: boolean
                        description: "Set to true if the transit declaration is a\
                          \ TSAD, otherwise set to false (for a TAD)"
                        example: false
                      sAndSMasterRefNum:
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers individual Transit consignments within a trailer.\
                          \ This applies to both ENS and EXS declarations. If there\
                          \ is one, include the S&S MRN for the Transit declaration\
                          \ above here. ENS will accept both the format of ICS2 and\
                          \ ICSNI MRNs in GB_TO_NI direction."
                        oneOf:
                        - pattern: "^[A-Z0-9-)(/]{1,200}$"
                          type: string
                          description: "The master reference number (MRN) for a Safety\
                            \ & Security declaration, where applicable."
                          example: GB12323020392
                    additionalProperties: false
                tirDeclarations:
                  minItems: 1
                  type: array
                  description: Details of one or more TIR Carnet declarations.  Must
                    be provided prior to check-in for TIR movements.
                  items:
                    required:
                    - tirCarnetId
                    type: object
                    properties:
                      tirCarnetId:
                        pattern: "^.{1,200}$"
                        type: string
                        description: The TIR Carnet ID for the carnet within a TIR
                          goods movement
                        example: ABC/123
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers TIR Carnet consignments within a trailer. This\
                          \ applies to both ENS and EXS declarations. If there is\
                          \ one, include the S&S MRN for the TIR declaration above\
                          \ here. ENS will accept both the format of ICS2 and ICSNI\
                          \ MRNs in GB_TO_NI direction."
                        example:
                        - GB12323020392
                    additionalProperties: false
                ataDeclarations:
                  minItems: 1
                  type: array
                  description: Details of one or more ATA Carnet declarations.  Must
                    be provided prior to check-in for ATA movements.
                  items:
                    required:
                    - ataCarnetId
                    type: object
                    properties:
                      ataCarnetId:
                        pattern: "^.{1,200}$"
                        type: string
                        description: The ATA Carnet ID for the carnet within an ATA
                          goods movement
                        example: ABC/123
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers ATA Carnet consignments within a trailer. This\
                          \ applies to both ENS and EXS declarations. If there is\
                          \ one, include the S&S MRN for the ATA declaration above\
                          \ here. ENS will accept both the format of ICS2 and ICSNI\
                          \ MRNs in GB_TO_NI direction."
                        example:
                        - GB12323020392
                    additionalProperties: false
                eidrDeclarations:
                  minItems: 1
                  type: array
                  description: "Details of one or more EIDR declarations.  Must be\
                    \ provided prior to check-in for EIDR movements.  For movements\
                    \ using a specially-issued EORI, the same EORI may be entered\
                    \ multiple times, one entry for each ENS S&S MRN travelling under\
                    \ EIDR."
                  items:
                    required:
                    - traderEORI
                    type: object
                    properties:
                      traderEORI:
                        pattern: "^(?:(?:GB|XI)[0-9]{12,15}|(?!GB|XI)[A-Z]{2}[0-9A-Z]{1,15})$"
                        type: string
                        description: "The trader's EORI, GB EORIs are valid for all\
                          \ direction movements, XI and EU EORIs are valid for only\
                          \ GB to NI movements."
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers individual EIDR consignments within a trailer.\
                          \ This applies to both ENS and EXS declarations. If there\
                          \ is one, include the S&S MRN for the EIDR declaration above\
                          \ here. ENS will accept both the format of ICS2 and ICSNI\
                          \ MRNs in GB_TO_NI direction."
                        example:
                        - GB12323020392
                      localReferenceNumber:
                        pattern: "^[A-Z0-9]{1,22}$"
                        type: string
                        description: It is only used for EIDR and UKIMS EIDR declarations
                          in the GB_TO_NI direction
                      procedureCode:
                        pattern: "^[0-9]{4}$"
                        type: string
                        description: It is only used for EIDR declarations in the
                          GB_TO_NI direction
                    additionalProperties: false
                ukimsEidrDeclarations:
                  minItems: 1
                  type: array
                  description: Details of one or more UKIMS EIDR declarations.
                  items:
                    required:
                    - traderEORI
                    type: object
                    properties:
                      traderEORI:
                        pattern: "^[A-Z]{2}[0-9]{12,15}$"
                        type: string
                        description: "The trader's EORI, only XI EORIs are valid."
                      nopWaiver:
                        type: boolean
                      localReferenceNumber:
                        pattern: "^[A-Z0-9]{1,22}$"
                        type: string
                        description: It is only used for EIDR and UKIMS EIDR declarations
                          in the GB_TO_NI direction
                      sAndSMasterRefNum:
                        pattern: "^[A-Z0-9-)(/]{1,200}$"
                        type: string
                        description: "The master reference number or Movement Reference\
                          \ Number (MRN) for a Safety & Security declaration, where\
                          \ applicable. This must be supplied when the S&S declaration\
                          \ covers individual UKIMS EIDR consignments within a trailer.\
                          \ This applies to both ENS and EXS declarations. If there\
                          \ is one, include the S&S MRN for the UKIMS EIDR declaration\
                          \ above here."
                        example:
                        - GB12323020392
                    additionalProperties: false
                indirectExportDeclarations:
                  minItems: 1
                  type: array
                  description: Details of the indirect export declarations within
                    this goods load.  Only valid for NI to GB movements where the
                    goods originated from outside UK.
                  items:
                    required:
                    - eadMasterRefNum
                    type: object
                    properties:
                      eadMasterRefNum:
                        pattern: "^\\d{2}(?!GB|XI)[A-Z]{2}[A-Z0-9]{14}$"
                        type: string
                        description: The master or movement reference number (MRN)
                          of the Export Accompanying Document (EAD) for this indirect
                          export.
                        example: 19IE294000AFGRIG29
                    additionalProperties: false
                emptyVehicle:
                  required:
                  - isOwnVehicle
                  type: object
                  properties:
                    isOwnVehicle:
                      type: boolean
                      description: Set to false if the haulier is moving the goods
                        vehicle under a contract of carriage.  Set to true if there
                        is no contract of carriage.
                      example: false
                    sAndSMasterRefNum:
                      pattern: "^[A-Z0-9-)(/]{1,200}$"
                      type: string
                      description: "The master reference number (MRN) for a Safety\
                        \ & Security declaration, where applicable."
                      example: GB12323020392
                  additionalProperties: false
                  description: Declares that this is an empty movement and contains
                    details about the empty movement.  Must be provided prior to check-in
                    for empty movements.
                dbcDeclaration:
                  required:
                  - isOwnVehicle
                  type: object
                  properties:
                    isOwnVehicle:
                      type: boolean
                      description: Set to false if the haulier is moving the goods
                        vehicle under a contract of carriage.  Set to true if there
                        is no contract of carriage.
                      example: false
                    dbcGoods:
                      minItems: 1
                      type: array
                      description: References for a Declaration by Conduct goods load.
                      items:
                        required:
                        - sAndSMasterRefNum
                        type: object
                        properties:
                          sAndSMasterRefNum:
                            pattern: "^[A-Z0-9-)(/]{1,200}$"
                            type: string
                            description: "The master reference number or Movement\
                              \ Reference Number (MRN) for a Safety & Security declaration,\
                              \ where applicable. This may be required when the S&S\
                              \ declaration covers a DBC that is moving under a contract\
                              \ of carriage. This applies to both ENS and EXS declarations."
                            example:
                            - GB12323020392
                        additionalProperties: false
                  additionalProperties: false
                  description: Declares goods moving under Declaration by Conduct.  Refer
                    to the Oral and By Conduct List published at gov.uk for details.
                exemptionDeclaration:
                  type: object
                  properties:
                    exemptedGoods:
                      minItems: 1
                      type: array
                      description: The list of goods loads exempted from customs.  Used
                        for GB>NI RMG <£900 B2B or GB>EU FPO+MOU goods loads.
                      items:
                        required:
                        - sAndSMasterRefNum
                        type: object
                        properties:
                          sAndSMasterRefNum:
                            pattern: "^[A-Z0-9-)(/]{1,200}$"
                            type: string
                            description: The MRN or DUCR (depending on direction)
                              for an ENS or EXS Safety & Security declaration for
                              this goods load. ENS will accept both the format of
                              ICS2 and ICSNI MRNs in GB_TO_NI direction.
                            example:
                            - GB12323020392
                        additionalProperties: false
                  additionalProperties: false
                  description: Declares Royal Mail Group or ETOE goods in the movement
                    that do not require a customs declaration.
                ukcDeclaration:
                  required:
                  - fpoEORI
                  type: object
                  properties:
                    fpoEORI:
                      pattern: "^[A-Z]{2}[0-9]{12,15}$"
                      type: string
                      description: GB or XI EORI for UK-C
                  additionalProperties: false
                  description: Details of UK-C declaration.
              additionalProperties: false
            examples:
              update_with_customs_declarations:
                value:
                  direction: UK_OUTBOUND
                  haulierType: STANDARD
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "63"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  customsDeclarations:
                  - customsDeclarationId: 0AB689275038503-XY119404
              update_with_eidr_declarations:
                value:
                  direction: GB_TO_NI
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "303"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  eidrDeclarations:
                  - traderEORI: GB123456789012
                    sAndSMasterRefNum: 20GB01I0XLM976S003
              update_empty_gmr:
                value:
                  direction: GB_TO_NI
                  haulierType: STANDARD
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "303"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  emptyVehicle:
                    isOwnVehicle: false
                    sAndSMasterRefNum: 20GB01I0XLM976S002
              update_with_ata_declarations:
                value:
                  direction: UK_OUTBOUND
                  isUnaccompanied: true
                  containerReferenceNums:
                  - CSQU3054383
                  plannedCrossing:
                    routeId: "63"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  ataDeclarations:
                  - ataCarnetId: SDOEFOK2982893
              update_with_tir_declarations:
                value:
                  direction: GB_TO_NI
                  isUnaccompanied: true
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "303"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  sAndSMasterRefNums:
                  - masterRefNum: 19GB4S24GC3PPFGVR7
                  - masterRefNum: 19GB4S24GC3PPFGVR8
                  tirDeclarations:
                  - tirCarnetId: FEOKEOK092927
              update_with_indirect_export_declarations:
                value:
                  direction: NI_TO_GB
                  haulierType: STANDARD
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "304"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  indirectExportDeclarations:
                  - eadMasterRefNum: 12IE12345678901234
                  - eadMasterRefNum: 12IE12345678901235
              update_with_dbc_declarations:
                value:
                  direction: UK_INBOUND
                  haulierType: STANDARD
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "60"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  dbcDeclaration:
                    isOwnVehicle: false
                    dbcGoods:
                    - sAndSMasterRefNum: 20GB01I0XLM976S002
                    - sAndSMasterRefNum: 20GB01I0XLM976S003
              update_with_mtp_declarations:
                value:
                  direction: UK_INBOUND
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  plannedCrossing:
                    routeId: "60"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  mtpDeclaration:
                    mtpGoods:
                    - sAndSMasterRefNum: 20GB01I0XLM976S002
                    - sAndSMasterRefNum: 20GB01I0XLM976S003
              update_with_ukc_declaration:
                value:
                  direction: GB_TO_NI
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "2"
                    localDateTimeOfDeparture: 2024-04-02T10:58
                  ukcDeclaration:
                    fpoEORI: GB123456789012
              update_with_ukimsEidr_declaration:
                value:
                  direction: GB_TO_NI
                  haulierType: STANDARD
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "60"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  ukimsEidrDeclarations:
                  - traderEORI: XI123456789012
                    sAndSMasterRefNum: 25GB9876AB88912AT9
                    nopWaiver: false
                    localReferenceNumber: AB123456789
              update_with_ukimsEidr_declaration2:
                value:
                  direction: GB_TO_NI
                  haulierType: STANDARD
                  isUnaccompanied: false
                  vehicleRegNum: AB19 DEF
                  trailerRegistrationNums:
                  - KF293716
                  - GH28372S
                  plannedCrossing:
                    routeId: "60"
                    localDateTimeOfDeparture: 2021-08-11T10:58
                  ukimsEidrDeclarations:
                  - traderEORI: XI286547329000
                    nopWaiver: true
        required: true
      responses:
        "202":
          description: |
            The goods movement record creation request has been accepted.  Use the Push Pull Notifications API to retrieve the GMR that will be created.
          headers:
            Notification-Message-Id:
              description: |
                The messageId that will be included in a notification message created in response to this request.  See above for more information about notifications.
              required: true
              style: simple
              explode: false
              schema:
                type: string
                example: 368ed1fc-a082-41cb-a8bd-ac04cc5bdc55
            Notification-Box-Id:
              description: |
                The boxId to use when retrieving the notification created in response to this request.  See above for more information about notifications.
              required: true
              style: simple
              explode: false
              schema:
                type: string
                example: 3af01911-75ed-4412-a12d-ca80f626ab10
        "400":
          description: ""
          content:
            application/json:
              schema:
                title: error-response
                required:
                - code
                type: object
                properties:
                  code:
                    type: string
              examples:
                INVALID_JSON_FORMAT:
                  description: |
                    The request body is not a valid JSON format.
                  value:
                    code: INVALID_JSON_FORMAT
                JSON_SCHEMA_ERROR:
                  description: |
                    The request body does not conform to the expected JSON schema.
                  value:
                    code: JSON_SCHEMA_ERROR
                INVALID_GMR_STATE:
                  description: |
                    The state provided is invalid
                  value:
                    code: INVALID_GMR_STATE
                NOT_YET_SUPPORTED:
                  description: |
                    The requested operation is not yet supported by the API.
                  value:
                    code: NOT_YET_SUPPORTED
                DIRECTION_CHANGE_NOT_SUPPORTED:
                  description: |
                    Direction change is not supported
                  value:
                    code: DIRECTION_CHANGE_NOT_SUPPORTED
                EORI_NOT_SUPPORTED:
                  description: |
                    The EORI provided is not supported by the API.
                  value:
                    code: EORI_NOT_SUPPORTED
                INVALID_ROUTE:
                  description: |
                    The routeId provided is not valid.
                  value:
